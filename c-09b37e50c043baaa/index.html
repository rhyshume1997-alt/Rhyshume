:root{--bg:#f4f4f0;--ink:#0b2a5b;--tint:#e8eaee;--rule:#c4c9d2;--stop:#c0281f;--ok:#1d6b3a;--paper:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 'IBM Plex Sans',system-ui,sans-serif;padding-bottom:96px}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0;color:var(--ink)}
h1{font-size:30px;line-height:1.15}
h2{font-size:24px;line-height:1.2}
h3{font-size:18px}
header.top{padding:20px 18px 14px;border-bottom:3px double var(--ink)}
.wm{font:500 12px 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
main{max-width:720px;margin:0 auto;padding:0 18px}
.intro{margin:18px 0}
.sec{margin:26px 0;border-top:3px double var(--ink);padding-top:14px}
.sec>.cnt{font:500 13px 'IBM Plex Sans',sans-serif;color:var(--ink);opacity:.75;margin:2px 0 10px}
.q{margin:16px 0}
.ql{display:block;font-weight:600;margin-bottom:4px}
.hint{font-size:14px;opacity:.8;margin:2px 0 6px}
input[type=text],input[type=email],textarea,select{width:100%;font:400 16px 'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--ink);border-radius:0;padding:11px 12px;min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus{outline:3px solid #7aa2f7;outline-offset:1px}
.seg{display:flex;gap:0;flex-wrap:wrap}
.seg button{flex:1 1 90px;min-height:46px;font:500 16px 'IBM Plex Sans',sans-serif;border:1px solid var(--ink);background:var(--paper);color:var(--ink);margin:0 -1px -1px 0;border-radius:0;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{font:500 16px 'IBM Plex Sans',sans-serif;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:11px 16px;min-height:46px;border-radius:0;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--rule);background:var(--paper);margin:8px 0}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none}
.card{border:1px solid var(--ink);background:var(--paper);padding:12px;margin:12px 0}
.card img{max-width:100%;max-height:220px;display:block;margin:0 0 10px;border:1px solid var(--rule);background:var(--tint)}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.row>.fix{flex:0 0 auto}
.sw{width:56px;height:46px;padding:2px;border:1px solid var(--ink);background:var(--paper)}
.note{border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--tint);padding:10px 12px;margin:12px 0;font-size:15px}
.note.bad{border-left-color:var(--stop)}
.note.ok{border-left-color:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:3px double var(--ink);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.bar .st{font-size:14px;line-height:1.3}
.bar .btn{flex:none}
.ro-banner{background:var(--ink);color:var(--bg);padding:10px 18px;font-weight:500;text-align:center}
.corner{font-size:12px;opacity:.7;text-align:right;padding:6px 18px}
.big{padding:40px 18px;text-align:center}
.meter{height:8px;background:var(--tint);border:1px solid var(--rule);margin:6px 0}
.meter>i{display:block;height:100%;background:var(--ink)}
@media (min-width:700px){h1{font-size:38px}body{font-size:18px}.bar{padding:12px 24px}}
@media print{.bar{display:none}}

    else if (P.status === 'saving') t = 'Saving';
    else if (P.status === 'offline') t = 'Not saved yet, no connection. I will try again';
    else if (P.status === 'big') t = 'Too big to save. Remove a picture or two';
    else if (P.status === 'error') t = 'Not saved yet, something went wrong. I will try again';
    else if (P.dirty) t = 'Changes not saved yet';
    else if (P.savedAt) t = 'Saved ' + new Date(P.savedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    else t = 'Nothing changed yet';
    el.textContent = t;
    var sn = $('#subnote'); if (sn) sn.innerHTML = subText();
  }

  /* ---- editing ---- */
  function touch() {
    if (P.ro || P.dead) return;
    P.dirty = true; if (P.submittedAt) P.afterSend = true;
    clearTimeout(P.timer); P.timer = setTimeout(function () { save(false); }, picTotal() > 300000 ? 10000 : 3000);
    counts(); status();
  }
  document.addEventListener('input', function (e) {
    var t = e.target; if (P.ro) return;
    if (t.dataset.p !== undefined && t.type !== 'select-one') { setp(t.dataset.p, t.value); touch(); }
    else if (t.dataset.af !== undefined && t.type === 'text') { var a = asset(t); if (a) { a[t.dataset.af] = t.value; touch(); } }
    else if (t.dataset.cf === 'pick') { var c = col(t); if (c) { c.hex = t.value.toLowerCase(); var h = t.closest('[data-col]').querySelector('[data-cf=hex]'); if (h) h.value = c.hex; touch(); } }
  });
  document.addEventListener('change', function (e) {
    var t = e.target; if (P.ro) return;
    if (t.dataset.p !== undefined && t.type === 'select-one') { setp(t.dataset.p, t.value); touch(); }
    else if (t.dataset.chk) { setp(t.dataset.chk, t.checked); touch(); }
    else if (t.dataset.af === 'type') { var a = asset(t); if (a) { a.type = t.value; touch(); } }
    else if (t.dataset.af === 'perm') { var a2 = asset(t); if (a2) { a2.perm = t.checked; touch(); } }
    else if (t.dataset.cf === 'role') { var c = col(t); if (c) { c.role = t.value; touch(); } }
    else if (t.dataset.cf === 'hex') { var c2 = col(t), h = normHex(t.value); if (c2 && h) { c2.hex = h; t.value = h; var p = t.closest('[data-col]').querySelector('[data-cf=pick]'); if (p) p.value = h; touch(); } else if (c2) t.value = c2.hex; }
    else if (t.dataset.files !== undefined && t.files && t.files.length) { var fs = Array.prototype.slice.call(t.files); t.value = ''; addPics(fs); }
  });
  function asset(el) { var id = el.closest('[data-asset]').dataset.asset; return P.A.brand.assets.filter(function (a) { return a.id === id; })[0]; }
  function col(el) { var id = el.closest('[data-col]').dataset.col; return P.A.brand.colours.filter(function (a) { return a.id === id; })[0]; }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-seg],[data-segq],[data-tier],[data-do]'); if (!t || P.ro) return;
    if (t.dataset.segq) { var pk = P.A.discovery._req.picks, id = t.dataset.segq; if (pk[id] === t.dataset.v) delete pk[id]; else pk[id] = t.dataset.v; Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute('aria-pressed', String(pk[id] === b.dataset.v)); }); var tr = document.getElementById('tr-' + id); P.opts.forEach(function (o) { if (o.id === id && tr) tr.innerHTML = tiersHtml(o); }); var nt = $('#ntot'); if (nt) nt.innerHTML = needsTotal(); touch(); return; }
    if (t.dataset.tier) { P.A.discovery._req.tiers[t.dataset.tier] = t.dataset.t; Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute('aria-pressed', String(b === t)); }); var nt2 = $('#ntot'); if (nt2) nt2.innerHTML = needsTotal(); touch(); return; }
    if (t.dataset.seg) { var cur = getp(t.dataset.seg), v = t.dataset.v; setp(t.dataset.seg, cur === v ? '' : v); Array.prototype.forEach.call(t.parentNode.children, function (b) { b.setAttribute('aria-pressed', String(getp(t.dataset.seg) === b.dataset.v)); }); touch(); return; }
    var d = t.dataset.do;
    if (d === 'addcol') { P.A.brand.colours.push({ id: uid(), role: 'primary', hex: '#0b2a5b' }); $('#cols').innerHTML = vColours(); touch(); }
    else if (d === 'rmcol') { P.A.brand.colours = P.A.brand.colours.filter(function (c) { return c.id !== t.dataset.id; }); $('#cols').innerHTML = vColours(); touch(); }
    else if (d === 'rmasset') { P.A.brand.assets = P.A.brand.assets.filter(function (c) { return c.id !== t.dataset.id; }); $('#assets').innerHTML = vAssets(); touch(); }
    else if (d === 'send') save(true);
    else if (d === 'sendreq') { var rq = P.A.discovery._req; if (!Object.keys(rq.picks).length) { $('#reqmsg').textContent = 'Tick at least one thing first'; return; } rq.requested = true; rq.at = new Date().toISOString(); touch(); save(true); }
  });
  window.addEventListener('beforeunload', function (e) { if (!P.ro && (P.dirty || P.saving) && !P.dead) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden' && P.dirty && !P.saving && !P.dead && !P.ro) save(false); });

  /* ---- pictures: 1600 px, compressed ---- */
  function readUrl(f) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = function () { no(new Error('could not read it')); }; r.readAsDataURL(f); }); }
  function bitmap(f) {
    if (window.createImageBitmap) return createImageBitmap(f, { imageOrientation: 'from-image' }).catch(function () { return viaImg(f); });
    return viaImg(f);
  }
  function viaImg(f) { return new Promise(function (ok, no) { var u = URL.createObjectURL(f), im = new Image(); im.onload = function () { URL.revokeObjectURL(u); ok(im); }; im.onerror = function () { no(new Error('the browser could not open it')); }; im.src = u; }); }
  async function shrink(f) {
    if (f.type === 'image/svg+xml') {
      if (f.size > 300000) throw new Error('the SVG is over 300 KB');
      var txt = await f.text(); if (/<script|\son\w+\s*=|javascript:|<foreignObject/i.test(txt)) throw new Error('the SVG has a script or embedded content, so I left it out');
      var bytes = new TextEncoder().encode(txt), s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return { data: 'data:image/svg+xml;base64,' + btoa(s), w: 0, h: 0, bytes: f.size };
    }
    var bm = await bitmap(f), w = bm.width || bm.naturalWidth, h = bm.height || bm.naturalHeight;
    var k0 = Math.min(1, MAXPIC / Math.max(w, h)), out = null, alpha = false;
    if (f.type !== 'image/jpeg') { var c0 = document.createElement('canvas'); c0.width = Math.max(1, Math.round(w * k0)); c0.height = Math.max(1, Math.round(h * k0)); var x0 = c0.getContext('2d'); x0.drawImage(bm, 0, 0, c0.width, c0.height); var px = x0.getImageData(0, 0, c0.width, c0.height).data; for (var j = 3; j < px.length; j += 16) { if (px[j] < 250) { alpha = true; break; } } }
    var scales = [1, 0.85, 0.7, 0.55, 0.4];
    for (var si = 0; si < scales.length && !out; si++) {
      var W = Math.max(1, Math.round(w * k0 * scales[si])), H = Math.max(1, Math.round(h * k0 * scales[si]));
      var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d');
      if (!alpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); }
      x.drawImage(bm, 0, 0, W, H);
      if (alpha) { var d = c.toDataURL('image/png'); if (d.length <= TARGET || si === scales.length - 1) out = { data: d, w: W, h: H }; }
      else { var qs = [0.82, 0.72, 0.62, 0.52]; for (var qi = 0; qi < qs.length && !out; qi++) { var dj = c.toDataURL('image/jpeg', qs[qi]); if (dj.length <= TARGET || (si === scales.length - 1 && qi === qs.length - 1)) out = { data: dj, w: W, h: H }; } }
    }
    out.bytes = Math.round(out.data.length * 0.75);
    if (/^image\/(jpeg|png|webp)$/.test(f.type) && w <= MAXPIC && h <= MAXPIC && f.size * 1.37 < out.data.length) { out = { data: await readUrl(f), w: w, h: h, bytes: f.size }; }
    return out;
  }
  async function addPics(files) {
    var msgs = [], n = 0;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      try {
        if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type)) throw new Error('is not a picture I can use, please choose a PNG, JPG, WEBP or SVG');
        var r = await shrink(f);
        if (picTotal() + r.data.length > MAXTOTAL) throw new Error('would make this page too big. Remove a picture first, or choose a smaller one');
        var base = f.name.replace(/\.[^.]+$/, '');
        P.A.brand.assets.push({ id: uid(), type: /logo/i.test(base) ? 'logo' : 'photo', name: base.slice(0, 200), note: '', licence: '', perm: false, data: r.data, w: r.w, h: r.h, bytes: r.bytes, orig: f.name.slice(0, 200) }); n++;
      } catch (e) { msgs.push(f.name + ' ' + (e.message || 'could not be added')); }
    }
    P.pics = (n ? 'Added ' + n + (n === 1 ? ' picture. ' : ' pictures. ') : '') + msgs.join('. ');
    $('#assets').innerHTML = vAssets(); if (n) touch(); else counts();
  }

  /* ---- saving ---- */
  async function save(submit) {
    if (P.ro || P.dead) return;
    if (P.saving) { P.again = true; if (submit) P.wantSend = true; return; }
    clearTimeout(P.timer); P.timer = 0;
    var body = JSON.stringify({ p_token: P.token, p_answers: outAnswers(), p_submit: !!submit });
    if (body.length > 7000000) { P.status = 'big'; status(); return; }
    P.saving = true; P.status = 'saving'; status();
    var sentDirty = JSON.stringify(P.A);
    try {
      var r = await fetch(SB + '/rest/v1/rpc/portal_save', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: body });
      var t = await r.text();
      if (!r.ok) { var er = new Error(t.slice(0, 200)); er.http = r.status; throw er; }
      var j = t ? JSON.parse(t) : null;
      if (j === null) { P.dead = true; P.status = ''; }
      else { P.status = ''; P.savedAt = Date.now(); if (JSON.stringify(P.A) === sentDirty) { P.dirty = false; if (submit) P.afterSend = false; } if (submit) { P.submittedAt = Date.now(); P.afterSend = P.dirty; render(); } }
    } catch (e) {
      if (e instanceof TypeError) P.status = 'offline'; else if (/too large/i.test(e.message)) P.status = 'big'; else P.status = 'error';
      if (P.status !== 'big') { clearTimeout(P.timer); P.timer = setTimeout(function () { save(!!submit && false); }, 15000); }
      if (submit) alert(P.status === 'offline' ? 'I could not send this, there is no connection. Your answers are still on this screen. Try again in a moment' : (P.status === 'big' ? 'This is too big to send. Remove a picture or two, then try again' : 'I could not send this. Try again in a moment'));
    }
    P.saving = false; status();
    if (P.dead) { render(); status(); return; }
    if (P.again) { P.again = false; var s = P.wantSend; P.wantSend = false; if (P.dirty || s) save(!!s); }
  }

  /* ---- start ---- */
  function start() {
    var h = location.hash.replace(/^#/, '');
    if (h === 'view') {
      P.ro = true; document.title = 'View as client';
      bigMsg('Loading', 'Waiting for the workbook');
      window.addEventListener('message', function (e) {
        if (e.origin !== location.origin || !(e.source === window.parent || e.source === window.opener)) return;
        var m = e.data; if (!m || m.type !== 'cw-view') return;
        P.name = String(m.client_name || '').slice(0, 200); P.A = normalise(m.answers); P.cfg = (m.cfg && typeof m.cfg === 'object') ? m.cfg : (P.A.discovery._cfg || null);
        P.opts = optsOf(P.cfg); P.A = normalise(m.answers && Object.assign({}, m.answers, { discovery: Object.assign({}, (m.answers && m.answers.discovery) || {}, { _cfg: P.cfg }) })); P.sections = sectionsOf(P.cfg); P.submittedAt = m.submitted_at || null; render();
      });
      var tgt = window.parent !== window ? window.parent : window.opener; if (tgt) tgt.postMessage({ type: 'cw-view-ready' }, location.origin);
      return;
    }
    var m = /(?:^|&)t=([0-9a-f]{48})(?:&|$)/.exec(h);
    if (!m) { bigMsg('This link is not working', 'It may be incomplete or switched off. Please ask Rhys to send it again'); return; }
    P.token = m[1]; bigMsg('Loading', 'One moment');
    rpc('portal_open', { p_token: P.token }).then(function (r) {
      if (!r) { bigMsg('This link is not working', 'It may be incomplete or switched off. Please ask Rhys to send it again'); return; }
      P.name = String(r.client_name || '').slice(0, 200); P.A = normalise(r.answers); P.cfg = P.A.discovery._cfg || null; P.opts = optsOf(P.cfg); P.sections = sectionsOf(P.cfg);
      P.submittedAt = r.submitted_at ? Date.parse(r.submitted_at) : null; render();
    }).catch(function () { bigMsg('I could not load this page', 'Check your connection and try again', '<p><button type="button" class="btn pri" onclick="location.reload()">Try again</button></p>'); });
  }
  function sectionsOf(cfg) { var s = cfg && Array.isArray(cfg.sections) ? cfg.sections.filter(function (x) { return SECS.indexOf(x) >= 0; }) : []; return s.length ? s : ['discovery', 'brand']; }
  start();
})();
</script>
