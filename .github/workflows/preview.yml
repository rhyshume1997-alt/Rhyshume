# Build a concept preview from the GitHub website, no computer tools needed.
# Actions tab > "Build preview" > Run workflow. Needs the repository secret ANTHROPIC_API_KEY.
# Writes preview/<slug>/ to a new branch called preview-<slug> and opens a pull request to main.
# Nothing is merged here. Merging that pull request is what puts the page live at
# rhyshume.co.uk/preview/<slug>/ (open to anyone, noindex). Vercel protection settings are not touched.
name: Build preview

on:
  workflow_dispatch:
    inputs:
      url:
        description: Their website, for example https://example.co.uk
        required: true
      slug:
        description: Short name, lower case, hyphens only, for example example-firm
        required: true
      competitor:
        description: Competitor website (optional)
        required: false
      name:
        description: Firm name, only if the tool gets it wrong (optional)
        required: false
      niche:
        description: Type of firm, adds the moves for that type
        required: false
        type: choice
        default: none
        options:
          - none
          - engineering

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the browser tools (for the phone screenshots and speed scores)
        run: |
          set -eu
          npm install --no-save --no-package-lock playwright-core@1.65.0 lighthouse@13.6.0 chrome-launcher@1.2.3
          npx playwright-core install --with-deps chromium

      - name: Build the preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IN_URL: ${{ inputs.url }}
          IN_SLUG: ${{ inputs.slug }}
          IN_COMPETITOR: ${{ inputs.competitor }}
          IN_NAME: ${{ inputs.name }}
          IN_NICHE: ${{ inputs.niche }}
        run: |
          set -eu
          args=("$IN_URL" "$IN_SLUG")
          if [ -n "$IN_COMPETITOR" ]; then args+=("$IN_COMPETITOR"); fi
          if [ -n "$IN_NAME" ]; then args+=(--name "$IN_NAME"); fi
          if [ -n "$IN_NICHE" ] && [ "$IN_NICHE" != "none" ]; then args+=(--niche "$IN_NICHE"); fi
          node tools/preview.js "${args[@]}"

      - name: Run the tests
        run: node --test

      - name: Save to a new branch and open a pull request
        env:
          IN_SLUG: ${{ inputs.slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git checkout -b "preview-$IN_SLUG"
          git add "preview/$IN_SLUG"
          git commit -m "Concept preview: $IN_SLUG"
          git push --force origin "preview-$IN_SLUG"
          body="Concept preview for $IN_SLUG. Read preview/$IN_SLUG/notes.md and check every line against their live site before merging. Merging puts the page live at https://www.rhyshume.co.uk/preview/$IN_SLUG/ (open to anyone, noindex)."
          if gh pr create --base main --head "preview-$IN_SLUG" --title "Concept preview: $IN_SLUG" --body "$body" > pr.txt 2> pr.err; then
            pr_line="Pull request: $(cat pr.txt)"
          else
            pr_line="Could not open the pull request (GitHub may need Settings > Actions > General > Allow GitHub Actions to create pull requests). Open it by hand: https://github.com/$GITHUB_REPOSITORY/compare/main...preview-$IN_SLUG?expand=1"
          fi
          {
            echo "### Preview saved"
            echo ""
            echo "Branch: \`preview-$IN_SLUG\`"
            echo ""
            echo "$pr_line"
            echo ""
            echo "Read \`preview/$IN_SLUG/notes.md\` and check every line against their live site."
            echo "Nothing has been merged. Merging the pull request makes the page public."
          } >> "$GITHUB_STEP_SUMMARY"
