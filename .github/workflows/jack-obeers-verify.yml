name: Jack O'Beers verify

# Runs the type check and the end to end tests, including Michael's two-click rule
# (home page to Add to basket in two clicks or fewer, every category, desktop and iPhone).
# If any category needs a third click, this fails.
on:
  push:
    branches: ["claude/jack-obeers-beers"]
    paths: ["jack-obeers-next/**"]
  pull_request:
    paths: ["jack-obeers-next/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jack-obeers-next
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: jack-obeers-next/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
