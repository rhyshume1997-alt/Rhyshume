@font-face{font-family:'Newsreader';font-weight:200 800;font-style:normal;font-display:swap;src:url(/fonts/newsreader-latin.woff2) format('woff2')}
/* Layout idea: left rail of the 10 sections, wide working pane, a status strip pinned on top. Workbook styling is deliberately separate from any client direction. */
:root{
  --paper:#eceee8; --panel:#f7f8f4; --ink:#14181a; --muted:#566057; --rule:#cdd2c6;
  --accent:#2340d8; --accent-ink:#ffffff; --ok:#1d7443; --warn:#8f5f00; --bad:#b0271f; --info:#2340d8;
  --ok-bg:#dcefe3; --warn-bg:#f6e8c4; --bad-bg:#f6d9d6; --info-bg:#dde3fb; --neutral-bg:#e2e5dc;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111518; --panel:#181d21; --ink:#e7ebe3; --muted:#9aa59a; --rule:#2c343a;
    --accent:#93a6ff; --accent-ink:#0d1230; --ok:#72c795; --warn:#e1b24c; --bad:#ef8a82; --info:#93a6ff;
    --ok-bg:#1c3326; --warn-bg:#3a2f12; --bad-bg:#3b1e1c; --info-bg:#1f2750; --neutral-bg:#242b30;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111518; --panel:#181d21; --ink:#e7ebe3; --muted:#9aa59a; --rule:#2c343a;
  --accent:#93a6ff; --accent-ink:#0d1230; --ok:#72c795; --warn:#e1b24c; --bad:#ef8a82; --info:#93a6ff;
  --ok-bg:#1c3326; --warn-bg:#3a2f12; --bad-bg:#3b1e1c; --info-bg:#1f2750; --neutral-bg:#242b30;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* top strip */
#top{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 20px}
#top .brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.01em}
#top .cell{display:flex;flex-direction:column;gap:1px;min-width:0}
#top .cell .mono{color:color-mix(in srgb,var(--paper) 62%,transparent)}
#top .cell b{font-weight:500;font-size:13.5px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top select{background:transparent;color:var(--paper);border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);padding:3px 6px;max-width:220px}
#top select option{color:#111}
.bar{width:120px;height:8px;background:color-mix(in srgb,var(--paper) 25%,transparent);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--paper)}
#banner{display:none;background:var(--warn-bg);color:var(--ink);border-bottom:1px solid var(--warn);padding:8px 20px;font-size:13.5px}
#banner.on{display:block}

/* shell */
#shell{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start}
#nav{position:sticky;top:52px;padding:18px 10px 18px 16px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 52px);overflow:auto}
#nav button{display:flex;gap:10px;align-items:baseline;justify-content:space-between;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:9px 10px;cursor:pointer;font-weight:500}
#nav button .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:8px}
#nav button .lbl{flex:1}
#nav button .tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
#nav button:hover{background:var(--neutral-bg)}
#nav button[aria-current="page"]{border-left-color:var(--accent);background:var(--panel);font-weight:600}
#main{padding:26px 28px 80px;min-width:0;max-width:1180px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:6px}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 22px}
@media (max-width:860px){
  #shell{grid-template-columns:1fr}
  #nav{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding:8px 12px;border-bottom:1px solid var(--rule)}
  #nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  #nav button[aria-current="page"]{border-bottom-color:var(--accent)}
  #nav .n{display:none}
  #main{padding:20px 16px 80px}
}

/* generic parts */
.panel{background:var(--panel);border:1px solid var(--rule);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.btn{background:var(--panel);border:1px solid var(--ink);padding:7px 13px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.del{border-color:var(--bad);color:var(--bad)}
.btn.del:hover{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--ink);margin:0 0 18px}
.tabs button{background:none;border:1px solid transparent;border-bottom:0;padding:8px 14px;cursor:pointer;font-weight:500;margin-bottom:-1px}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--ink);font-weight:600}
.tabs .c{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-weight:600;font-size:13.5px}
.hint{color:var(--muted);font-size:12.5px}
input[type=text],input[type=url],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-bottom-color:var(--ink);padding:7px 9px;border-radius:0}
textarea{resize:vertical;min-height:64px}
input[type=color]{width:38px;height:34px;padding:0;border:1px solid var(--rule);background:none}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;padding:4px 0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 18px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)}.chip.warn{color:var(--warn);background:var(--warn-bg)}.chip.bad{color:var(--bad);background:var(--bad-bg)}.chip.info{color:var(--info);background:var(--info-bg)}.chip.neutral{color:var(--muted);background:var(--neutral-bg)}
.note{border-left:4px solid var(--accent);background:var(--info-bg);padding:10px 14px;font-size:13.5px}
.note.warn{border-color:var(--warn);background:var(--warn-bg)}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.item{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:12px}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top;font-size:13.5px}
th{background:var(--neutral-bg);font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:500}
.scroll{overflow-x:auto}
.sw{display:inline-block;width:22px;height:22px;border:1px solid var(--ink);vertical-align:middle}
.swrow{display:flex;gap:0}
.swrow i{flex:1;height:26px;border:1px solid var(--ink);border-right:0}
.swrow i:last-child{border-right:1px solid var(--ink)}
.crumbs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.crumbs li{display:flex;gap:10px;align-items:baseline}
.dot{width:10px;height:10px;border:2px solid var(--ink);flex:none;margin-top:5px}
.dot.ok{background:var(--ok);border-color:var(--ok)}
pre.out{background:var(--paper);border:1px solid var(--ink);padding:14px;white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;font:12.5px/1.55 var(--mono);margin:0}
.spec{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.spec .side{position:sticky;top:64px}
@media (max-width:980px){.spec{grid-template-columns:1fr}.spec .side{position:static}}
.specimen{border:1px solid var(--ink);padding:18px;display:flex;flex-direction:column;gap:10px}
.cmp{min-width:860px;table-layout:fixed}
.cmp td{white-space:pre-wrap}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.libcard{border:1px solid var(--ink);background:var(--panel);display:flex;flex-direction:column}
.libcard .band{height:64px;display:flex}
.libcard .band i{flex:1}
.libcard .in{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.flow{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.step .num{font-family:var(--mono);font-size:12px;border:2px solid var(--ink);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:500}
.step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.step.prog .num{border-color:var(--accent);color:var(--accent)}
.step.blk .num{border-color:var(--bad);color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--ink);max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.mact{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;z-index:60;font-size:13.5px;max-width:90vw}
#toast[hidden]{display:none}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.imgs figure{margin:0;border:1px solid var(--rule);background:var(--panel);padding:8px;display:flex;flex-direction:column;gap:6px}
.imgs img{width:100%;height:120px;object-fit:contain;background:var(--paper)}

/* concept preview (scoped, driven by the selected direction) */
.pvwrap{border:1px solid var(--ink);background:var(--neutral-bg);padding:14px;display:flex;justify-content:center}
.pvframe{container-type:inline-size;width:100%;height:700px;overflow:auto;background:var(--pv-bg);color:var(--pv-ink);font-family:var(--pv-body),system-ui,sans-serif;position:relative;transition:max-width .25s ease}
.pvframe .pvh{font-family:var(--pv-head),system-ui,sans-serif}
.pvframe .pvm{font-family:var(--pv-mono),ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.pv-nav{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--pv-ink);gap:16px}
.pv-nav .links{display:flex;gap:22px}
.pv-hero{display:grid;grid-template-columns:1.3fr .7fr;gap:34px;padding:56px 28px 44px;align-items:end}
.pv-h1{font-size:clamp(40px,10.5cqw,112px);line-height:.94;font-weight:700;margin:14px 0 22px;overflow-wrap:anywhere}
.pv-h1 span{display:inline-block;margin-right:.22em}
.pv-lead{max-width:46ch;font-size:clamp(15px,2cqw,19px);line-height:1.5;opacity:.88}
.pv-cta{display:inline-block;margin-top:26px;padding:14px 22px;background:var(--pv-acc);color:var(--pv-acc-ink);font-weight:600;border:0;font-size:15px;font-family:inherit;cursor:pointer}
.pv-imgwrap{overflow:hidden;border:1px solid var(--pv-ink)}
.pv-img{display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;background:var(--pv-tint);min-height:200px;aspect-ratio:var(--pv-ar,4/5)}
.pv-sec{display:grid;grid-template-columns:.7fr 1.3fr;gap:34px;padding:48px 28px;border-top:1px solid var(--pv-ink)}
.pv-sec h2{font-size:clamp(26px,5cqw,52px);line-height:1;font-weight:700}
.pv-list{list-style:none;margin:0;padding:0}
.pv-list li{padding:14px 0;border-bottom:1px solid var(--pv-ink);display:flex;justify-content:space-between;gap:14px;font-size:clamp(16px,2.4cqw,24px)}
.pv-form{padding:40px 28px;border-top:1px solid var(--pv-ink);display:grid;gap:10px;max-width:560px}
.pv-form input,.pv-form textarea{background:transparent;border:1px solid var(--pv-ink);color:inherit;padding:10px;font:inherit;width:100%}
.pv-foot{padding:22px 28px;background:var(--pv-ink);color:var(--pv-bg);font-size:13px}
.pv-sticky{position:sticky;bottom:0;display:none;background:var(--pv-acc);color:var(--pv-acc-ink);padding:14px 20px;font-weight:600;justify-content:space-between}
@container (max-width:640px){
  .pv-hero,.pv-sec{grid-template-columns:1fr;gap:22px;padding-left:18px;padding-right:18px}
  .pv-nav{padding:14px 18px}.pv-nav .links{display:none}
  .pv-sticky{display:flex}.pv-form{padding:30px 18px}
}
@keyframes pvrise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pvwipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes pvscale{from{opacity:.4;transform:scale(1.1)}to{opacity:1;transform:none}}
.pvframe[data-i="rise"] .pv-h1 span{animation:pvrise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n) * 70ms)}
.pvframe[data-i="wipe"] .pv-img{animation:pvwipe .9s cubic-bezier(.65,0,.35,1) both}
.pvframe[data-i="scale"] .pv-img{animation:pvscale 1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.pvframe *{animation:none!important;transition:none!important}}
@media print{#top,#nav,.btn{display:none}}
</style>
</head>
<body>
<header id="top"></header>
<div id="banner" role="status"></div>
<div id="shell">
  <nav id="nav" aria-label="Workbook sections"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<script>
'use strict';
/* ---------- constants ---------- */
const KEY='wcd-workbook-v1';
const STATUS=['Confirmed by client','Proposed by Rhys','Awaiting client decision','Not yet checked','Rejected'];
const STCLASS={'Confirmed by client':'ok','Proposed by Rhys':'info','Awaiting client decision':'warn','Not yet checked':'neutral','Rejected':'bad'};
const GOALS=['Generate enquiries','Encourage telephone calls','Generate booking requests','Sell products','Explain services','Display a portfolio','Build trust','Support existing customers'];
const CTAS=['Send an enquiry','Call us','Request a booking','Browse products','See our services','View our work','Why people choose us','Get support'];
const SRCS=['','Client statement','Evidence (cite it)','Assumption, unverified'];
const ASSET_NAMES=['Logo files','Brand guidelines','Genuine business photographs','Videos','Service descriptions','Product information','Existing website content','Required policies and notices','Other approved media'];
const ASSET_STATUS=['Not checked','Client has it','Client will supply','Rhys to create','Received','Not available','Not needed'];
const FLOW=['Discovery','Scope definition','Responsibilities and dependencies','Quote','Statement of requirements','Contract and written acceptance','Deposit','Claude Code handoff','Build and testing','Client review','Acceptance','Handover','Care plan'];
const FLOWHINT=[
 'Interview complete and the record is filled in.',
 'Included, not included and extra, written down per feature.',
 'Who supplies what, and by when.',
 'Quote from your price book. Not stored here. Say "Not VAT registered" on every quote.',
 'Revision of the statement of requirements that the client reads and confirms.',
 'Signature: drawn signature plus typed name, date and time, document revision, and a confirming email. Contract wording is not legal advice; use your solicitor-reviewed template.',
 'Work starts when the deposit has cleared.',
 'One prompt from the approved requirements. Creative approval alone does not trigger this.',
 'Build, then test. Record the evidence in the quality review.',
 'Client reviews the built site against the statement of requirements.',
 'Written acceptance of the built site.',
 'Domain, hosting, email and accounts in the client\'s name. IP passes on final payment.',
 'Define the included edit time before it is sold.'];
const REVIEW_CHECKS=['Design consistency','Distinctiveness from common templates','Client brand alignment','Clear contact or conversion actions','Mobile usability','Keyboard accessibility','Reduced motion','Responsive typography','Image optimisation','Performance','Forms and integrations','Content accuracy','Missing assets','Search visibility basics','Testing evidence','Outstanding client approvals'];
const REVIEW_COMPLIANCE=['Privacy notice','Cookies and analytics (ICO)','Accessibility (WCAG 2.2 AA)','Form data handling and storage','Image and font licences','Review rules (CMA)','Advertising claims (CAP)','Sector rules (for example alcohol or food: licensing standards officer)','Whether a sole trader client counts as a consumer','Whether the ICO data protection fee applies to Rhys','Security considerations'];
const RSTATUS=['Not yet checked','Pass','Fail','Not applicable'];
const DEFAULT_RULES='Flat colour. No decorative gradients, glass blur, artificial glows or glamorous drop shadows.\nTinted light and dark tones in place of pure white and pure black. Accent colours used on purpose.\nNo repetitive grids of identical cards. Deliberate asymmetry and varied spacing. Every section has a reason to exist.\nNo decorative icon above every heading. No default template section patterns.\nMotion has a purpose: position, scale and opacity only, controlled easing, no bounce. One signature interaction per page. Respect prefers-reduced-motion. Never make essential content depend on an animation finishing.\nAuthentic client photography for live claims, staff, premises, products and completed work. Never present generated imagery as real work. No fabricated reviews, staff, customers, awards, case studies or achievements.\nNo interaction that only works on hover. Comfortable touch targets. Sticky mobile contact action where it helps and does not cover content.\nFonts properly licensed and self-hosted.';
const DEFAULT_ACCEPT='Checked at 390px and 1280px wide.\nWCAG 2.2 AA: contrast, keyboard use, alt text, labelled forms.\nKeyboard-only walkthrough and reduced-motion walkthrough completed.\nLighthouse 90 or above for Performance, Accessibility, Best Practices and SEO, with the report attached as evidence.\nEvery form tested end to end, with where enquiries arrive confirmed.\nEvery fact on the site traceable to the confirmed record.\nAnything missing is listed, not filled in.';
const SEEDS=[
 {id:'seed1',name:'Olive & Ivory',sector:'Wedding photography',pal:['#f6f0e7','#2c2a25','#5b6f55'],fonts:['Newsreader','Great Vibes'],dir:'Romantic Scottish wedding album with soft photography, spacious composition and a signature style interaction.'},
 {id:'seed2',name:'Bright Circuit Electrical',sector:'Electrician',pal:['#f1f1ec','#17212d','#f1b400'],fonts:['Archivo','IBM Plex Sans'],dir:'Strong industrial typography, technical equipment details and clearly visible emergency contact actions.'},
 {id:'seed3',name:'Salt & Ember',sector:'Restaurant',pal:['#1f1612','#f2e7d6','#dd6b40'],fonts:['Newsreader','IBM Plex Sans'],dir:'Candlelit editorial food photography with an interactive menu inspired layout.'},
 {id:'seed4',name:'Sunny Hours Club',sector:'After school activities',pal:['#fff6df','#1d2947','#e5432a','#12907f','#ffc830'],fonts:['Archivo','IBM Plex Sans'],dir:'Colourful activity timetable with friendly compositions and clear information for parents.'},
 {id:'seed5',name:'Clear Ground Coaching',sector:'Coaching',pal:['#ebe8df','#1d2a24','#2f5d4b'],fonts:['Newsreader','IBM Plex Sans'],dir:'Restrained editorial journal with natural imagery and thoughtful reading flow.'},
 {id:'seed6',name:'Little Kettle Café',sector:'Café',pal:['#fbf3e4','#3a2418','#e0674a','#4f7a5a'],fonts:['Newsreader','IBM Plex Sans'],dir:'Inviting café editorial with warm photography and a visually distinctive specials board.'},
 {id:'seed7',name:'The Corner Shelf',sector:'Gift and home shop',pal:['#f2eee6','#1d1c19','#c4442b'],fonts:['Archivo','IBM Plex Sans'],dir:'Independent retail catalogue with bold typography, staggered product photography and browsable collections.'},
 {id:'seed8',name:'Oak & Razor',sector:'Barber',pal:['#1a1a1d','#ece6d8','#c9a05a'],fonts:['Archivo','IBM Plex Sans'],dir:'Confident barber identity with dramatic type, close craft details and restrained brass accents.'}
];
const SECTIONS=[
 ['projects','Projects'],['discovery','Discovery'],['directions','Creative Directions'],['library','Design Library'],['structure','Website Structure'],
 ['assets','Assets and Photography'],['preview','Preview'],['decisions','Decisions and Approval'],['handoff','Build Handoff'],['export','Export and Backup']];

/* ---------- tiny helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);
const filled=x=>x!=null&&String(x).trim().length>0;
const chip=(t,c)=>`<span class="chip ${c||STCLASS[t]||'neutral'}">${esc(t)}</span>`;
const hexOK=h=>/^#[0-9a-fA-F]{6}$/.test(h||'');

/* ---------- data ---------- */
const newDir=()=>({id:uid(),name:'',concept:'',palette:[],type:{heading:'',body:'',mono:'',hier:''},spacing:'',layout:'',photo:'',aspects:'',interaction:'',motionLib:'',mobile:'',commercial:'',trade:'',status:'Proposed by Rhys',date:today(),source:'',ref:''});
const MK={
 feature:()=>({id:uid(),name:'',purpose:'',req:'',solution:'',deps:'',owner:'',incl:'Undecided',qs:''}),
 page:()=>({id:uid(),name:'',purpose:'',action:'',heading:'',sections:'',photo:'',interactions:'',mobile:'',a11y:'',deps:'',tech:'',status:'Proposed by Rhys',date:today(),source:''}),
 photo:()=>({id:uid(),subject:'',aspect:'3:2',treatment:'',source:'Client photograph',usage:'Live site (must be authentic)',owner:'',status:'Needed',notes:''}),
 decision:()=>({id:uid(),text:'',status:'Not yet checked',date:today(),source:'',area:'',internal:false}),
 question:()=>({id:uid(),text:'',owner:'',status:'Open',answer:'',date:today(),internal:false}),
 approval:()=>({id:uid(),what:'',kind:'Creative',rev:'',by:'',date:today(),evidence:''}),
 change:()=>({id:uid(),title:'',date:today(),by:'',scope:'',price:'',delivery:'',status:'Proposed',ref:''}),
 ref:()=>({id:uid(),url:'',note:'',stance:'Like'}),
 sw:()=>({hex:'#cccccc',label:'',role:'Other'}),
 asset:()=>({id:uid(),name:'',status:'Not checked',owner:'',notes:''})
};
function newProject(name){
 const t=new Date().toISOString();
 return {id:uid(),name,createdAt:t,updatedAt:t,rev:1,
  changeLog:[{rev:1,date:today(),note:'Project created',supersedes:''}],
  disc:{b:{},o:{goals:{}},a:{},c:{refs:[]},src:{}},
  assets:ASSET_NAMES.map(n=>Object.assign(MK.asset(),{name:n})),
  features:[],dirs:[newDir(),newDir(),newDir()],sel:null,
  pages:[],photos:[],files:[],decisions:[],questions:[],approvals:[],changes:[],
  flow:FLOW.map(n=>({name:n,status:'Not started',date:'',note:''})),
  review:REVIEW_CHECKS.map(n=>({id:uid(),name:n,kind:'check',status:'Not yet checked',evidence:''})).concat(REVIEW_COMPLIANCE.map(n=>({id:uid(),name:n,kind:'compliance',status:'Not yet checked',evidence:''}))),
  designRules:DEFAULT_RULES,acceptance:DEFAULT_ACCEPT,specNotes:'',internal:'',pv:{mode:'desktop',inter:'rise'}};
}
function normalize(p){
 const d=newProject(p.name||'Untitled');
 for(const k of Object.keys(d)){ if(p[k]==null)p[k]=d[k]; }
 p.disc=p.disc||{}; for(const k of ['b','o','a','c','src']){ if(!p.disc[k])p.disc[k]={}; }
 if(!p.disc.o.goals)p.disc.o.goals={}; if(!p.disc.c.refs)p.disc.c.refs=[];
 while(p.dirs.length<3)p.dirs.push(newDir());
 p.dirs.forEach(x=>{const n=newDir();for(const k of Object.keys(n)){if(x[k]==null)x[k]=n[k]}x.type=Object.assign({heading:'',body:'',mono:'',hier:''},x.type);x.palette=x.palette||[]});
 return p;
}
const fresh=()=>({app:'website-creative-director',schema:1,activeId:null,projects:[],library:[],meta:{lastChange:null,lastBackup:null}});

/* ---------- storage (browser only, may be lost) ---------- */
let storeOK=true,ST=null;
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const o=JSON.parse(r);if(o&&Array.isArray(o.projects)){o.projects.forEach(normalize);o.library=o.library||[];o.meta=o.meta||{};return o}}catch(e){}return null}
ST=load()||fresh();
let saveTimer=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(ST));storeOK=true}catch(e){storeOK=false}updateChrome()}
function touch(){ST.meta.lastChange=new Date().toISOString();const p=P();if(p)p.updatedAt=ST.meta.lastChange;clearTimeout(saveTimer);saveTimer=setTimeout(persist,350);updateChrome()}
const P=()=>ST.projects.find(p=>p.id===ST.activeId)||null;

/* ---------- path get/set ---------- */
function getv(path,root){return path.split('.').reduce((o,k)=>o==null?o:o[k],root||P())}
function setv(path,v,root){const ks=path.split('.');let o=root||P();for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v}

/* ---------- field renderer ---------- */
function fld(path,label,o){
 o=o||{};const id='f_'+path.replace(/\./g,'_');const v=getv(path);const vv=v==null?'':v;
 const rr=o.rr?' data-rr="1"':'';
 let inp;
 if(o.type==='textarea')inp=`<textarea id="${id}" data-p="${path}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}"${rr}>${esc(vv)}</textarea>`;
 else if(o.type==='select')inp=`<select id="${id}" data-p="${path}"${rr}>${o.opts.map(x=>`<option value="${esc(x)}"${x===vv?' selected':''}>${esc(x||'Choose')}</option>`).join('')}</select>`;
 else inp=`<input id="${id}" type="${o.type||'text'}" data-p="${path}" value="${esc(vv)}" placeholder="${esc(o.ph||'')}"${rr}>`;
 let src='';
 if(o.src){const sp='disc.src.'+o.src;const sv=getv(sp)||'';src=`<select class="small" aria-label="Source of this answer" data-p="${sp}" data-rr="1">${SRCS.map(x=>`<option value="${esc(x)}"${x===sv?' selected':''}>${x?'Source: '+esc(x):'Source: not marked'}</option>`).join('')}</select>${sv==='Assumption, unverified'?'<span class="chip warn">Assumption</span>':''}`}
 return `<div class="f${o.w?' '+o.w:''}"><label for="${id}">${esc(label)}</label>${o.hint?`<p class="hint">${o.hint}</p>`:''}${inp}${src}</div>`;
}
const stSel=(path,label)=>fld(path,label||'Status',{type:'select',opts:STATUS,rr:1});

/* ---------- modal, toast, clipboard ---------- */
function modal(title,body,actions){
 const m=$('#modal');
 m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="stack">${body}</div><div class="mact">${(actions||[]).map(x=>`<button class="btn ${x.cls||''}" data-act="${x.act}" data-a="${esc(x.a||'')}">${esc(x.label)}</button>`).join('')}<button class="btn" data-act="close">Close</button></div></div>`;
 m.hidden=false;const f=m.querySelector('input,textarea,select');if(f)f.focus();
}
const closeModal=()=>{const m=$('#modal');m.hidden=true;m.innerHTML=''};
const mval=n=>{const e=document.querySelector('#modal [data-m="'+n+'"]');return e?e.value:''};
let toastT=null;
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{e.hidden=true},3200)}
function copyText(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(()=>true,()=>fbCopy(t))}}catch(e){}
 return Promise.resolve(fbCopy(t));
}
function fbCopy(t){try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}

/* ---------- file output: downloads capability, else copy box ---------- */
async function offerFile(name,text,isBackup){
 let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(e){}
 if(dl){
  try{await dl.save({filename:name,data:text});if(isBackup){ST.meta.lastBackup=new Date().toISOString();persist()}toast('Saved '+name);return}
  catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return}}
 }
 modal('Copy '+name,`<p class="small muted">Downloads are not available in this view. Copy the text below and paste it into a file called <b>${esc(name)}</b> on your computer. Keep that file safe: it is your backup.</p><textarea readonly rows="14" id="rawout" style="font-family:var(--mono);font-size:12px">${esc(text)}</textarea>`,[{label:'Copy to clipboard',act:'copyraw',a:isBackup?'b':'',cls:'pri'}]);
}

/* ---------- readiness ---------- */
function checks(p){
 const b=p.disc.b,o=p.disc.o,a=p.disc.a,c=p.disc.c;
 const fl=p.flow;
 return [
  {ok:filled(b.name)&&filled(b.desc),label:'Business name and description recorded',go:'discovery'},
  {ok:Object.values(o.goals||{}).some(Boolean)&&filled(o.primary),label:'Objectives set, with the most important outcome chosen',go:'discovery'},
  {ok:filled(a.who)&&filled(a.problem),label:'Target audience described',go:'discovery'},
  {ok:filled(c.feel)||filled(c.likes),label:'Creative preferences recorded',go:'discovery'},
  {ok:p.features.length>0&&p.features.every(f=>f.incl!=='Undecided'),label:'Every feature marked included, excluded or extra',go:'discovery'},
  {ok:p.assets.every(a=>['Received','Not needed'].includes(a.status)),label:'All content and assets received or not needed',go:'assets'},
  {ok:p.dirs.every(d=>filled(d.concept)),label:'Three directions drafted',go:'directions'},
  {ok:p.sel!=null&&p.dirs[p.sel]&&p.dirs[p.sel].status==='Confirmed by client',label:'Preferred direction confirmed by the client',go:'directions'},
  {ok:p.pages.length>0&&p.pages.every(x=>filled(x.purpose)),label:'Pages defined, each with a purpose',go:'structure'},
  {ok:!p.decisions.some(d=>d.status==='Awaiting client decision')&&!p.dirs.some(d=>d.status==='Awaiting client decision'),label:'No decisions awaiting the client',go:'decisions'},
  {ok:!p.questions.some(q=>q.status==='Open'),label:'No open questions',go:'decisions'},
  {ok:fl[5].status==='Done'&&fl[6].status==='Done',label:'Contract accepted in writing and deposit recorded',go:'decisions'}
 ];
}
const readiness=p=>{const c=checks(p);return {c,pct:Math.round(100*c.filter(x=>x.ok).length/c.length)}};
const outstanding=p=>p.decisions.filter(d=>['Awaiting client decision','Not yet checked'].includes(d.status)).length+p.dirs.filter(d=>d.status==='Awaiting client decision').length+p.questions.filter(q=>q.status==='Open').length;
const missingAssets=p=>p.assets.filter(a=>!['Received','Not needed'].includes(a.status));

/* ---------- colour maths ---------- */
function lum(h){const c=[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function contrast(a,b){if(!hexOK(a)||!hexOK(b))return 0;const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function roles(d){
 const pal=(d.palette||[]).filter(s=>hexOK(s.hex));
 const by=r=>{const s=pal.find(x=>x.role===r);return s&&s.hex};
 const bg=by('Background')||(pal[0]&&pal[0].hex)||'#f4f4f0';
 const ink=by('Ink')||(pal[1]&&pal[1].hex)||'#15171a';
 const acc=by('Accent')||(pal[2]&&pal[2].hex)||ink;
 const accInk=contrast(acc,ink)>contrast(acc,bg)?ink:bg;
 return {bg,ink,acc,accInk};
}
const loadedFonts=new Set(['Archivo','IBM Plex Sans','IBM Plex Mono','Newsreader','Great Vibes']);
function ensureFont(n){/* no external requests: only self-hosted fonts load, other names fall back */}

/* ---------- UI state, chrome ---------- */
const UI={sec:'projects',dtab:'A',dirtab:'cmp',stab:'pages',htab:'spec'};
function navMeta(p){
 const m={};
 if(!p)return m;
 const b=p.disc.b;const keys=[b.name,b.industry,b.location,b.contact,b.desc,p.disc.o.primary,p.disc.a.who,p.disc.a.problem,p.disc.c.feel];
 m.discovery=keys.filter(filled).length+'/'+keys.length;
 m.directions=p.dirs.filter(d=>filled(d.concept)).length+'/3';
 m.structure=String(p.pages.length);
 m.assets=missingAssets(p).length?missingAssets(p).length+' open':'ok';
 m.decisions=outstanding(p)?outstanding(p)+' open':'clear';
 return m;
}
function renderChrome(){
 const p=P();
 $('#top').innerHTML=`<span class="brand">Website Creative Director</span>
  <div class="cell"><span class="mono">Project</span><select id="projsel" aria-label="Current project">${ST.projects.length?ST.projects.map(x=>`<option value="${x.id}"${x.id===ST.activeId?' selected':''}>${esc(x.name||'Untitled')}</option>`).join(''):'<option>No project yet</option>'}</select></div>
  <div class="cell"><span class="mono">Revision</span><b id="c-rev"></b></div>
  <div class="cell"><span class="mono">Preferred direction</span><b id="c-dir"></b></div>
  <div class="cell"><span class="mono">Outstanding</span><b id="c-out"></b></div>
  <div class="cell"><span class="mono">Readiness</span><span class="row" style="gap:8px"><span class="bar" aria-hidden="true"><i id="c-bar"></i></span><b id="c-pct"></b></span></div>
  <div class="cell"><span class="mono">Backup</span><b id="c-bak"></b></div>`;
 updateChrome();
}
function updateChrome(){
 const p=P();if(!$('#c-rev'))return;
 $('#c-rev').textContent=p?'Rev '+p.rev:'none';
 $('#c-dir').textContent=p&&p.sel!=null&&p.dirs[p.sel]?(p.dirs[p.sel].name||'Direction '+(p.sel+1))+' ('+p.dirs[p.sel].status+')':'not chosen';
 $('#c-out').textContent=p?outstanding(p)+' items':'none';
 const r=p?readiness(p):{pct:0};
 $('#c-bar').style.width=r.pct+'%';$('#c-pct').textContent=p?r.pct+'%':'none';
 const lc=ST.meta.lastChange,lb=ST.meta.lastBackup;
 $('#c-bak').textContent=!lb?(lc?'never, changes unsaved':'never'):(lc&&lc>lb?'changes since '+lb.slice(0,10):'up to date');
 const meta=navMeta(p);
 $('#nav').innerHTML=SECTIONS.map(([k,t],i)=>`<button data-act="go" data-a="${k}"${UI.sec===k?' aria-current="page"':''}><span><span class="n">${String(i+1).padStart(2,'0')}</span><span class="lbl">${esc(t)}</span></span><span class="tag">${esc(meta[k]||'')}</span></button>`).join('');
 const bn=$('#banner');
 let msg='';
 if(!storeOK)msg='This browser would not keep the data (storage is blocked or full). Nothing is being saved automatically. Use Export and Backup now, and again before you close this page.';
 else if(ST.projects.length&&(!lb||(lc&&lc>lb)))msg='Your data is kept in this browser only and can be lost (cleared site data, another device, another browser). Download a backup from Export and Backup after each session.';
 bn.textContent=msg;bn.classList.toggle('on',!!msg);
}

A.newrev=()=>{const p=P();modal('Create Rev '+(p.rev+1),`<p class="small muted">Rev ${p.rev} will be marked as superseded. Describe what changed.</p><div class="f"><label for="nr">What changed</label><textarea id="nr" data-m="note" rows="3"></textarea></div>`,[{label:'Create revision',act:'newrevgo',cls:'pri'}])};

<script>
/* ---------- markdown builders (single source: the project record) ---------- */
const kv=(l,v)=>'- **'+l+':** '+(filled(v)?String(v).trim().replace(/\n/g,'\n  '):'_Not supplied_');
const stTxt=o=>o.status+(o.date?', '+o.date:'')+(o.source?', source: '+o.source:'');
const selDir=p=>p.sel!=null?p.dirs[p.sel]:null;
const srcOf=(p,k)=>{const s=p.disc.src[k];return s?' ['+s+']':''};
const M={};
M.identity=p=>{const b=p.disc.b;return ['## Project identity',kv('Project',p.name),'- **Revision:** Rev '+p.rev,kv('Business name',b.name),kv('Industry and services',b.industry),kv('Location and service area',b.location),kv('Current website',b.site),kv('Main contact',[b.contact,b.role].filter(filled).join(', ')),kv("Business description (client's own words)",b.desc),kv('Existing branding',b.branding),kv('Existing online presence',b.presence),kv('Competitors and reference websites',b.competitors)].join('\n')};
M.objectives=p=>{const o=p.disc.o;const g=GOALS.filter(x=>o.goals[x]);return ['## Business objectives',kv('Objectives the client wants',g.join(', ')),kv('Most important outcome',o.primary),kv('How visitors will contact or purchase',o.how),kv('Notes',o.notes),'_No conversion rates or business outcomes are promised or implied._'].join('\n')};
M.audience=p=>{const a=p.disc.a;return ['## Target users',kv('Who the customer is',a.who)+srcOf(p,'who'),kv('Problem they are trying to solve',a.problem)+srcOf(p,'problem'),kv('Why they might choose this business',a.why)+srcOf(p,'why'),kv('What might stop them enquiring',a.blockers)+srcOf(p,'blockers'),kv('Information needed before deciding',a.info)+srcOf(p,'info'),kv('Mobile or desktop',[a.device,a.deviceNote].filter(filled).join(', '))+srcOf(p,'device')].join('\n')};
M.creative=p=>{const c=p.disc.c;const refs=c.refs.map(r=>'  - '+(r.stance||'')+': '+(r.url||'(no link)')+(r.note?' ('+r.note+')':'')).join('\n');return ['## Client creative preferences (recorded, not proposals)',kv('Sites they like',c.likes),kv('Sites they dislike',c.dislikes),kv('What appeals to them',c.appeals),kv('Colours that feel appropriate',c.colours),kv('Existing fonts or brand rules',c.fonts),kv('Feel',[c.feel,c.feelNote].filter(filled).join(', ')),kv('Photography central to the design',c.photoCentral),kv('Animations or interactions they like',c.anim),kv('Must be avoided',c.avoid),'- **Reference links:**'+(refs?'\n'+refs:' _None recorded_'),'_Liking a site does not mean the client wants it copied._'].join('\n')};
M.direction=(p,full)=>{
 const d=selDir(p);
 if(!d)return '## Selected creative direction\n_No direction has been selected._';
 const pal=d.palette.map(s=>'  - '+s.hex+' '+(s.role||'')+(s.label?' ('+s.label+')':'')).join('\n');
 const L=['## Selected creative direction','- **Name:** '+(d.name||'Direction '+(p.sel+1)),'- **Status:** '+stTxt(d),kv('Creative concept',d.concept),'- **Colour palette:**'+(pal?'\n'+pal:' _Not supplied_'),kv('Heading font',d.type.heading),kv('Body font',d.type.body),kv('Mono font',d.type.mono),kv('Hierarchy',d.type.hier),kv('Spacing principles',d.spacing),kv('Layout composition',d.layout),kv('Photographic approach',d.photo),kv('Aspect ratios',d.aspects),kv('Signature interaction',d.interaction),kv('Motion library',d.motionLib),kv('Mobile experience',d.mobile)];
 if(full){L.push(kv('Commercial reasoning',d.commercial),kv('Tradeoffs',d.trade))}
 return L.join('\n');
};
M.pages=p=>['## Page architecture'].concat(p.pages.length?p.pages.map((x,i)=>['### '+(i+1)+'. '+(x.name||'Untitled page')+' ('+stTxt(x)+')',kv('Purpose',x.purpose),kv('Primary audience action',x.action),kv('Main heading direction',x.heading),kv('Required content sections',x.sections),kv('Photography',x.photo),kv('Important interactions',x.interactions),kv('Mobile behaviour',x.mobile),kv('Accessibility',x.a11y),kv('Client content dependencies',x.deps),kv('Technical requirements',x.tech)].join('\n')):['_No pages defined._']).join('\n\n');
M.assets=p=>{
 const rows=p.assets.map(a=>'| '+a.name+' | '+a.status+' | '+(a.owner||'no owner')+' | '+(a.notes||'').replace(/\|/g,'/').replace(/\n/g,' ')+' |').join('\n');
 const ph=p.photos.map(x=>'| '+(x.subject||'(untitled)')+' | '+x.aspect+' | '+x.source+' | '+x.usage+' | '+x.status+' | '+(x.owner||'no owner')+' |').join('\n');
 return '## Content and asset register\n| Asset | Status | Responsible | Notes |\n|---|---|---|---|\n'+rows+'\n\n### Photography and media requirements\n'+(ph?'| Subject | Ratio | Source | Use | Status | Responsible |\n|---|---|---|---|---|---|\n'+ph:'_No photography requirements recorded._')+'\n\nGenerated imagery is only for a clearly labelled fictional concept. It must never stand in for real work, staff, premises or products.';
};
M.features=p=>{
 const f=p.features;const by=k=>f.filter(x=>x.incl===k);
 const fmt=x=>['- **'+(x.name||'Untitled feature')+'**',kv('  Purpose',x.purpose),kv('  Client requirements',x.req),kv('  Proposed solution',x.solution),kv('  Dependencies',x.deps),kv('  Responsible',x.owner),kv('  Outstanding questions',x.qs)].join('\n');
 return ['## Functional requirements (included only)'].concat(by('Included').length?by('Included').map(fmt):['_None marked as included._']).concat(['','## Confirmed exclusions'],by('Excluded').length?by('Excluded').map(x=>'- '+(x.name||'Untitled')+(x.purpose?': '+x.purpose:'')):['_None recorded._'],['','## Extra (quoted separately, not part of this build)'],by('Extra, quoted separately').length?by('Extra, quoted separately').map(x=>'- '+(x.name||'Untitled')):['_None recorded._']).join('\n');
};
M.open=(p,safe)=>{
 const q=p.questions.filter(x=>x.status==='Open'&&!(safe&&x.internal));
 const un=p.features.filter(x=>x.incl==='Undecided');
 const fq=p.features.filter(x=>filled(x.qs));
 const miss=missingAssets(p);
 const dec=p.decisions.filter(d=>['Awaiting client decision','Not yet checked'].includes(d.status)&&!(safe&&d.internal));
 const L=['## Dependencies and unresolved questions'];
 L.push('### Open questions');L.push(...(q.length?q.map(x=>'- '+x.text+(x.owner?' (owner: '+x.owner+')':'')):['_None._']));
 L.push('### Feature questions');L.push(...(fq.length?fq.map(x=>'- '+x.name+': '+x.qs):['_None._']));
 L.push('### Features with no included or excluded decision');L.push(...(un.length?un.map(x=>'- '+x.name):['_None._']));
 L.push('### Decisions not yet confirmed');L.push(...(dec.length?dec.map(d=>'- '+d.text+' ['+d.status+']'):['_None._']));
 L.push('### Missing assets');L.push(...(miss.length?miss.map(a=>'- '+a.name+' ('+a.status+', responsible: '+(a.owner||'no owner')+')'):['_None._']));

M.testing=p=>'## Testing and acceptance criteria\n'+p.acceptance.split('\n').filter(filled).map(x=>'- '+x).join('\n');
M.rules=p=>'## Design rules for this build\n'+p.designRules.split('\n').filter(filled).map(x=>'- '+x).join('\n');
M.a11y='## Accessibility requirements\n- WCAG 2.2 AA as the standard: contrast, full keyboard operation with visible focus, alt text, labelled form fields, logical heading order.\n- Respect prefers-reduced-motion. Essential content never depends on an animation finishing.\n- Touch targets comfortable on phones. No interaction that works only on hover.';

M.interactions=p=>{const d=selDir(p);return '## Interaction requirements\n'+kv('One signature interaction',d&&d.interaction)+'\n'+kv('Motion library',d&&d.motionLib)+'\n'+p.pages.filter(x=>filled(x.interactions)).map(x=>kv('Page: '+x.name,x.interactions)).join('\n')+'\n- Motion uses position, scale and opacity with controlled easing and no bounce. Supporting transitions stay restrained.'};
M.flow=p=>'## Workflow status\n| Stage | Status | Date | Reference |\n|---|---|---|---|\n'+p.flow.map(s=>'| '+s.name+' | '+s.status+' | '+(s.date||'')+' | '+(s.note||'').replace(/\|/g,'/')+' |').join('\n');
M.decisions=(p,safe)=>{const L=p.decisions.filter(d=>!(safe&&d.internal));return '## Decisions\n'+(L.length?'| Decision | Status | Date | Source | Area |\n|---|---|---|---|---|\n'+L.map(d=>'| '+d.text.replace(/\|/g,'/')+' | '+d.status+' | '+(d.date||'')+' | '+(d.source||'').replace(/\|/g,'/')+' | '+(d.area||'')+' |').join('\n'):'_None recorded._')};
M.approvals=p=>'## Approvals\n'+(p.approvals.length?p.approvals.map(a=>'- **'+a.kind+':** '+a.what+' (Rev '+(a.rev||'?')+', by '+(a.by||'unrecorded')+', '+a.date+', evidence: '+(a.evidence||'none recorded')+')').join('\n'):'_None recorded._');
M.changes=p=>'## Change requests\n'+(p.changes.length?p.changes.map(c=>'- **'+(c.title||'Untitled')+'** ['+c.status+', '+c.date+']\n  - Scope: '+(c.scope||'_not supplied_')+'\n  - Price effect: '+(c.price||'_not supplied_')+'\n  - Delivery effect: '+(c.delivery||'_not supplied_')+(c.ref?'\n  - Approval reference: '+c.ref:'')).join('\n'):'_None recorded._');
M.log=p=>'## Change log\n'+p.changeLog.map(l=>'- Rev '+l.rev+', '+l.date+': '+l.note+(l.supersedes?' (supersedes '+l.supersedes+')':'')).join('\n');
M.review=p=>'## Quality review\n| Check | Type | Status | Evidence |\n|---|---|---|---|\n'+p.review.map(r=>'| '+r.name+' | '+(r.kind==='compliance'?'Compliance':'Quality')+' | '+r.status+' | '+(r.evidence||'').replace(/\|/g,'/').replace(/\n/g,' ')+' |').join('\n')+'\n\nCompliance and legal items need verification from an official source before they are marked as passed. A visual preview is not a technical review.';
M.features_all=p=>'## Features (all)\n'+(p.features.length?p.features.map(x=>['- **'+(x.name||'Untitled')+'** ['+x.incl+']',kv('  Purpose',x.purpose),kv('  Client requirements',x.req),kv('  Proposed solution',x.solution),kv('  Dependencies',x.deps),kv('  Responsible',x.owner),kv('  Outstanding questions',x.qs)].join('\n')).join('\n'):'_None._');
M.dirs_all=p=>'## Creative directions (all)\n'+p.dirs.map((d,i)=>['### Direction '+(i+1)+': '+(d.name||'unnamed')+(p.sel===i?' (preferred)':''),'- **Status:** '+stTxt(d),d.ref?'- **Reference:** '+d.ref:'',kv('Concept',d.concept),kv('Palette',d.palette.map(s=>s.hex+' '+(s.role||'')+(s.label?' '+s.label:'')).join(', ')),kv('Typography',[d.type.heading,d.type.body,d.type.mono].filter(filled).join(' / ')+(d.type.hier?'. '+d.type.hier:'')),kv('Spacing',d.spacing),kv('Layout',d.layout),kv('Photography',d.photo+(d.aspects?'. Ratios: '+d.aspects:'')),kv('Signature interaction',d.interaction),kv('Motion library',d.motionLib),kv('Mobile',d.mobile),kv('Commercial reasoning',d.commercial),kv('Tradeoffs',d.trade)].filter(Boolean).join('\n')).join('\n\n');

function mdSpec(p){
 return ['# Website design specification: '+p.name+' (Rev '+p.rev+')','_Built from the project record. Proposed items are marked with their status._',M.identity(p),M.objectives(p),M.audience(p),M.creative(p),M.direction(p,true),M.pages(p),M.assets(p),M.features(p),M.interactions(p),M.mobile(p),M.a11y,M.rules(p),filled(p.specNotes)?'## Extra specification notes\n'+p.specNotes:'',M.open(p,true)].filter(Boolean).join('\n\n')+'\n';

function handoffPrompt(p){

 L.push('# Build brief for Claude Code: '+p.name+' (Rev '+p.rev+')');
 const unmet=readiness(p).c.filter(c=>!c.ok);const prior=p.flow.slice(0,7).filter(s=>s.status!=='Done');
 if(!(d&&d.status==='Confirmed by client')||unmet.length||prior.length)L.push('> **DRAFT. Not approved for build.** Open items: '+(unmet.map(c=>c.label).concat(prior.map(s=>'workflow stage not done: '+s.name)).join('; ')||'direction not confirmed')+'. Do not treat this as an approved brief.');

 L.push(M.identity(p),M.objectives(p),M.audience(p),M.direction(p,false),M.pages(p),M.assets(p),M.interactions(p),M.mobile(p),M.a11y,M.rules(p),M.features(p),M.open(p,true),M.testing(p));
 L.push('## Reporting\nWhen finished, report: what you changed (files), what you tested and how, evidence for each acceptance criterion, anything you could not do, and every placeholder still in the site. Do not mark anything done without evidence.');

/* ---------- renderers ---------- */
const R={};
const head=(t,l,right)=>'<div class="head"><h1>'+t+'</h1>'+(right||'')+'</div><p class="lede">'+l+'</p>';

R.projects=()=>{
 let h=head('Projects','Each client has a separate record. The record is the single source of truth: every export, specification and handoff is generated from it.','<button class="btn pri" data-act="newproj">New project</button>');
 if(!ST.projects.length){

 }
 h+='<div class="grid2">'+ST.projects.map(p=>{const r=readiness(p);const cur=p.flow.find(s=>s.status!=='Done');return `<div class="item"${p.id===ST.activeId?' style="border-left-color:var(--accent)"':''}><div class="top"><h3>${esc(p.name)}</h3>${p.id===ST.activeId?chip('Open','info'):''}</div><div class="small muted">Rev ${p.rev}. Updated ${esc((p.updatedAt||'').slice(0,10))}. Stage: ${esc(cur?cur.name:'all stages done')}.</div><div class="row"><span class="bar" style="background:var(--rule);width:140px"><i style="width:${r.pct}%;background:var(--accent)"></i></span><b>${r.pct}% ready</b></div><div class="row"><button class="btn sm pri" data-act="openproj" data-a="${p.id}">Open</button><button class="btn sm del" data-act="delproj" data-a="${p.id}">Delete</button></div></div>`}).join('')+'</div>';

function assetTable(p){

}

R.discovery=()=>{
 const p=P();if(!p)return head('Discovery','Structured interview. Record what the client says, and mark what is only an assumption.')+needProject();
 const b=p.disc.b,o=p.disc.o,a=p.disc.a,c=p.disc.c;
 const cnt=(arr)=>arr.filter(filled).length+'/'+arr.length;
 const T=[['A','A Business',cnt([b.name,b.industry,b.location,b.site,b.contact,b.desc,b.branding,b.presence,b.competitors])],['B','B Objectives',Object.values(o.goals).filter(Boolean).length+' picked'],['C','C Audience',cnt([a.who,a.problem,a.why,a.blockers,a.info])],['D','D Creative',cnt([c.likes,c.dislikes,c.appeals,c.colours,c.fonts,c.feel,c.photoCentral,c.anim,c.avoid])],['E','E Content and assets',missingAssets(p).length+' open'],['F','F Features',p.features.length+' listed']];
 let h=head('Discovery','Work through A to F with the client. Do not fabricate details that have not been given: leave a field empty and it shows as an open gap.')+tabs('dtab',T);
 const t=UI.dtab;
 if(t==='A')h+=`<div class="fields">${fld('disc.b.name','Business name')}${fld('disc.b.site','Current website, if any',{type:'url',ph:'https://'})}${fld('disc.b.industry','Industry and services',{type:'textarea',ph:'What they do, one service per line'})}${fld('disc.b.location','Location and service area',{type:'textarea'})}${fld('disc.b.contact','Main contact')}${fld('disc.b.role','Their role')}${fld('disc.b.desc','Business description in the client\'s own words',{type:'textarea',rows:5,w:'wide',hint:'Their words, not yours. This can appear in the preview as draft copy.'})}${fld('disc.b.branding','Existing branding',{type:'textarea',hint:'Logo, colours, fonts, guidelines already in use.'})}${fld('disc.b.presence','Existing online presence',{type:'textarea',hint:'Social accounts, Google Business Profile, directories.'})}${fld('disc.b.competitors','Main competitors and reference websites',{type:'textarea',w:'wide'})}</div>`;
 if(t==='B')h+=`<div class="stack"><div class="panel"><h3 style="margin-bottom:6px">What should the website achieve?</h3>${GOALS.map(g=>chk('disc.o.goals.'+g,esc(g))).join('')}</div><div class="fields">${fld('disc.o.primary','Which outcome matters most?',{type:'select',opts:[''].concat(GOALS,['Other (say in notes)']),rr:1})}${fld('disc.o.how','How the client expects visitors to contact or purchase',{type:'textarea'})}${fld('disc.o.notes','Notes',{type:'textarea',w:'wide'})}</div><div class="note">Do not invent conversion rates or promise business outcomes.</div></div>`;
 if(t==='C')h+=`<div class="note" style="margin-bottom:14px">Mark each answer as a client statement, evidence, or an assumption. Unmarked answers are treated as unverified.</div><div class="fields">${fld('disc.a.who','Who is the customer?',{type:'textarea',src:'who'})}${fld('disc.a.problem','What problem are they trying to solve?',{type:'textarea',src:'problem'})}${fld('disc.a.why','Why might they choose this business?',{type:'textarea',src:'why'})}${fld('disc.a.blockers','What might stop them enquiring?',{type:'textarea',src:'blockers'})}${fld('disc.a.info','What information do they need before deciding?',{type:'textarea',src:'info'})}${fld('disc.a.device','Mainly mobile or desktop?',{type:'select',opts:['','Not known','Mostly mobile','Mostly desktop','Mixed'],src:'device',rr:1})}${fld('disc.a.deviceNote','Evidence for that',{type:'textarea',hint:'Analytics, call logs, what the client has seen. If there is none, leave it empty.'})}</div>`;
 if(t==='D')h+=`<div class="fields">${fld('disc.c.likes','Which websites do you like?',{type:'textarea'})}${fld('disc.c.dislikes','Which websites do you dislike?',{type:'textarea'})}${fld('disc.c.appeals','What specifically appeals to you about them?',{type:'textarea',w:'wide',hint:'Liking a site is not a request to copy it.'})}${fld('disc.c.colours','Which colours feel appropriate?',{type:'textarea'})}${fld('disc.c.fonts','Existing fonts or brand rules',{type:'textarea'})}${fld('disc.c.feel','Should it feel...',{type:'select',opts:['','Traditional','Contemporary','Premium','Playful','Something else'],rr:1})}${fld('disc.c.feelNote','In their words',{})}${fld('disc.c.photoCentral','Should photography be central?',{type:'select',opts:['','Yes','No','Not decided']})}${fld('disc.c.anim','Animations or interactions you like',{type:'textarea'})}${fld('disc.c.avoid','Anything that must be avoided',{type:'textarea',w:'wide'})}</div><h3 style="margin:22px 0 8px">Reference links</h3><p class="hint" style="margin-bottom:10px">Paste URLs and say what they like or dislike. Upload screenshots on the Assets and Photography page.</p><div class="stack">${c.refs.map((r,i)=>`<div class="item"><div class="top"><span class="mono">Reference ${i+1}</span>${delBtn('disc.c.refs',i)}</div><div class="fields">${fld(`disc.c.refs.${i}.url`,'Link',{type:'url',ph:'https://'})}${fld(`disc.c.refs.${i}.stance`,'Stance',{type:'select',opts:['Like','Dislike','Neutral']})}${fld(`disc.c.refs.${i}.note`,'What about it?',{type:'textarea',w:'wide'})}</div></div>`).join('')}${addBtn('disc.c.refs','ref','Add reference link')}</div>`;
 if(t==='E')h+=`<p class="lede" style="margin-top:0">Record what the client can provide and who is responsible for supplying what is missing.</p>${assetTable(p)}`;
 if(t==='F')h+=`<p class="lede" style="margin-top:0">Never assume an integration is included because the design suggests it. Mark every feature Included, Excluded or Extra.</p><div class="row" style="margin-bottom:14px"><span class="mono">Quick add</span>${['Contact form','Bookings','Online shop','Gallery','Third-party integration','Content editing','Newsletter sign-up','Drawing or file upload'].map(n=>`<button class="btn sm" data-act="addfeat" data-a="${esc(n)}">${esc(n)}</button>`).join('')}</div><div class="stack">${p.features.map((f,i)=>`<div class="item"><div class="top"><h3>${esc(f.name||'New feature')}</h3><div class="row">${chip(f.incl,f.incl==='Included'?'ok':f.incl==='Excluded'?'bad':f.incl==='Undecided'?'warn':'info')}${delBtn('features',i)}</div></div><div class="fields">${fld(`features.${i}.name`,'Feature')}${fld(`features.${i}.incl`,'Included in this build?',{type:'select',opts:['Undecided','Included','Excluded','Extra, quoted separately'],rr:1})}${fld(`features.${i}.purpose`,'Intended purpose',{type:'textarea'})}${fld(`features.${i}.req`,'Client requirements',{type:'textarea'})}${fld(`features.${i}.solution`,'Proposed solution',{type:'textarea'})}${fld(`features.${i}.deps`,'Dependencies',{type:'textarea'})}${fld(`features.${i}.owner`,'Responsible party')}${fld(`features.${i}.qs`,'Outstanding questions',{type:'textarea'})}</div></div>`).join('')}${addBtn('features','feature','Add feature')}</div>`;
 return h;
};

function specimen(d,title){
 const r=roles(d);const hf=d.type.heading?`font-family:'${esc(d.type.heading.replace(/[^A-Za-z0-9 ]/g,''))}',system-ui,sans-serif;`:'';const bf=d.type.body?`font-family:'${esc(d.type.body.replace(/[^A-Za-z0-9 ]/g,''))}',system-ui,sans-serif;`:'';const mf=d.type.mono?`font-family:'${esc(d.type.mono.replace(/[^A-Za-z0-9 ]/g,''))}',monospace;`:'font-family:var(--mono);';
 const pal=d.palette.filter(s=>hexOK(s.hex));
 return `<div class="specimen" style="background:${r.bg};color:${r.ink}"><span style="${mf}font-size:11px;letter-spacing:.12em;text-transform:uppercase">${esc(d.name||'Direction')} specimen</span><div style="${hf}font-size:40px;line-height:1;font-weight:700">${esc(title||'Heading in the chosen face')}</div><p style="${bf}font-size:15px;line-height:1.5">Body text sample in the chosen face. Check it reads well at small sizes and on a phone.</p><span style="display:inline-block;align-self:flex-start;padding:9px 16px;background:${r.acc};color:${r.accInk};${bf}font-weight:600">Call to action</span></div>${pal.length?`<div class="swrow" style="margin-top:8px">${pal.map(s=>`<i style="background:${s.hex}" title="${esc(s.hex)} ${esc(s.role||'')}"></i>`).join('')}</div>`:''}`;
}
R.directions=()=>{
 const p=P();if(!p)return head('Creative Directions','Three genuinely different directions, compared side by side.')+needProject();
 const T=[['cmp','Compare']].concat(p.dirs.map((d,i)=>[String(i),'Direction '+(i+1),d.name||(filled(d.concept)?'drafted':'empty')]));
 let h=head('Creative Directions','Not three colour variations of one template. Each direction is a different idea. All stay "Proposed" until Rhys or the client approves them.',`<div class="row"><button class="btn" data-act="askreq">Copy request for Claude</button><button class="btn" data-act="pastedirs">Paste Claude\'s reply</button></div>`)+tabs('dirtab',T);
 h+=`<details class="small muted" style="margin:-8px 0 16px"><summary>How generating directions works here</summary><p style="margin-top:6px">This page cannot call Claude by itself. "Copy request for Claude" builds a prompt from the recorded discovery. Paste it into a Claude chat, then paste the JSON reply back with "Paste Claude's reply" to fill the three slots as Proposed. You can also type or edit every field by hand, or start a slot from the Design Library.</p></details>`;
 if(UI.dirtab==='cmp'){
  const rows=[['Creative concept','concept'],['Visual identity',null],['Layout composition','layout'],['Photography','photo'],['Signature interaction','interaction'],['Mobile experience','mobile'],['Commercial reasoning','commercial'],['Tradeoffs','trade']];
  h+=`<div class="scroll"><table class="cmp"><thead><tr><th style="width:130px"></th>${p.dirs.map((d,i)=>`<th>Direction ${i+1}${p.sel===i?' (preferred)':''}</th>`).join('')}</tr></thead><tbody>
  <tr><td class="mono">Name and status</td>${p.dirs.map(d=>`<td><b>${esc(d.name||'Unnamed')}</b><br>${chip(d.status)}</td>`).join('')}</tr>
  ${rows.map(([l,k])=>`<tr><td class="mono">${l}</td>${p.dirs.map(d=>k?`<td>${filled(d[k])?esc(d[k]):'<span class="muted">Not drafted</span>'}</td>`:`<td>${d.palette.length?`<div class="swrow">${d.palette.filter(s=>hexOK(s.hex)).map(s=>`<i style="background:${s.hex}"></i>`).join('')}</div><div class="small" style="margin-top:6px">${esc([d.type.heading,d.type.body,d.type.mono].filter(filled).join(' / ')||'No fonts chosen')}</div>`:'<span class="muted">Not drafted</span>'}</td>`).join('')}</tr>`).join('')}
  <tr><td class="mono">Choose</td>${p.dirs.map((d,i)=>`<td><button class="btn sm ${p.sel===i?'':'pri'}" data-act="${p.sel===i?'clearsel':'setsel'}" data-a="${i}">${p.sel===i?'Clear preferred':'Mark as preferred'}</button></td>`).join('')}</tr></tbody></table></div><p class="small muted" style="margin-top:10px">Marking a direction as preferred does not confirm it. Set its status to Confirmed by client once they have said yes, and record where they said it.</p>`;
  return h;
 }
 const i=+UI.dirtab,d=p.dirs[i];
 h+=`<div class="spec"><div class="stack"><div class="fields">${fld(`dirs.${i}.name`,'Direction name')}${stSel(`dirs.${i}.status`)}${fld(`dirs.${i}.date`,'Status date',{type:'date'})}${fld(`dirs.${i}.source`,'Source of the status',{ph:'e.g. email from client 21 Nov'})}</div>${d.ref?`<div class="note small">${esc(d.ref)}. A library entry is only a starting point.</div>`:''}
 <div class="fields">${fld(`dirs.${i}.concept`,'Creative concept',{type:'textarea',rows:4,w:'wide',hint:'The visual idea and why it suits this business.'})}</div>
 <div class="panel stack"><h3>Visual identity</h3><div class="stack">${d.palette.map((s,j)=>`<div class="row"><input type="color" aria-label="Colour picker" data-p="dirs.${i}.palette.${j}.hex" value="${hexOK(s.hex)?s.hex:'#cccccc'}"><input aria-label="Hex value" style="width:104px" data-p="dirs.${i}.palette.${j}.hex" value="${esc(s.hex)}"><input aria-label="Colour label" style="width:150px" data-p="dirs.${i}.palette.${j}.label" value="${esc(s.label)}" placeholder="Label"><select aria-label="Role" style="width:140px" data-p="dirs.${i}.palette.${j}.role" data-rr="1">${['Background','Ink','Accent','Secondary','Other'].map(r=>`<option${r===s.role?' selected':''}>${r}</option>`).join('')}</select>${delBtn(`dirs.${i}.palette`,j)}</div>`).join('')}${addBtn(`dirs.${i}.palette`,'sw','Add colour')}</div><div class="fields">${fld(`dirs.${i}.type.heading`,'Heading font',{ph:'Google Fonts name, e.g. Archivo'})}${fld(`dirs.${i}.type.body`,'Body font')}${fld(`dirs.${i}.type.mono`,'Mono or label font')}${fld(`dirs.${i}.type.hier`,'Hierarchy',{type:'textarea'})}${fld(`dirs.${i}.spacing`,'Spacing principles',{type:'textarea',w:'wide'})}</div></div>
 <div class="fields">${fld(`dirs.${i}.layout`,'Layout composition',{type:'textarea',rows:4,w:'wide',hint:'How the hero, supporting sections, imagery and calls to action are arranged.'})}${fld(`dirs.${i}.photo`,'Photographic approach',{type:'textarea',hint:'Subjects, lighting, framing, colour treatment.'})}${fld(`dirs.${i}.aspects`,'Aspect ratios',{ph:'e.g. 4:5, 3:2'})}${fld(`dirs.${i}.interaction`,'Signature interaction',{type:'textarea',hint:'One principal interaction that makes it memorable.'})}${fld(`dirs.${i}.motionLib`,'Motion library',{ph:'To confirm'})}${fld(`dirs.${i}.mobile`,'Mobile experience',{type:'textarea',w:'wide'})}${fld(`dirs.${i}.commercial`,'Commercial reasoning',{type:'textarea',hint:'How it supports the stated objectives. No promised outcomes.'})}${fld(`dirs.${i}.trade`,'Tradeoffs',{type:'textarea',hint:'Usability, accessibility, performance, build complexity, content needs.'})}</div>
 <div class="row"><button class="btn pri" data-act="setsel" data-a="${i}">Mark as preferred</button>${d.status==='Confirmed by client'?`<button class="btn" data-act="libnew" data-a="dir:${i}">Save to Design Library</button>`:''}</div></div>
 <aside class="side">${specimen(d,p.disc.b.name||'Business name')}${d.palette.some(s=>hexOK(s.hex))?(()=>{const r=roles(d);const x=contrast(r.ink,r.bg),y=contrast(r.acc,r.bg);return `<p class="small" style="margin-top:10px">Ink on background: <b>${x.toFixed(1)}:1</b> ${x>=4.5?chip('AA','ok'):chip('Below AA','bad')}<br>Accent on background: <b>${y.toFixed(1)}:1</b> ${y>=3?chip('AA large or UI','ok'):chip('Below 3:1','bad')}</p>`})():''}</aside></div>`;
 return h;
};

R.library=()=>{

 const card=(x,custom)=>`<div class="libcard"><div class="band">${x.pal.map(c=>`<i style="background:${esc(c)}"></i>`).join('')}</div><div class="in"><div class="row" style="justify-content:space-between"><h3>${esc(x.name)}</h3>${custom?chip(x.approved?'Approved reference':'Draft','info'):chip('Fictional starter','neutral')}</div><span class="mono">${esc(x.sector)}</span><div style="font-size:26px;line-height:1.1;font-family:'${esc((x.fonts[0]||'').replace(/[^A-Za-z0-9 ]/g,''))}',system-ui,sans-serif">${esc(x.name)}</div><div class="small" style="font-family:'${esc((x.fonts[1]||'').replace(/[^A-Za-z0-9 ]/g,''))}',system-ui,sans-serif">${esc(x.dir)}</div><div class="small muted">${esc(x.pal.join('  '))}<br>${esc(x.fonts.filter(Boolean).join(' / '))}</div><div class="row" style="margin-top:auto"><button class="btn sm" data-act="libuse" data-a="${x.id}"${p?'':' disabled'}>Use as a starting point</button>${custom?`<button class="btn sm" data-act="libnew" data-a="edit:${x.id}">Edit</button><button class="btn sm del" data-act="libdel" data-a="${x.id}">Delete</button>`:''}</div></div></div>`;

};

R.assets=()=>{

 const tot=p.files.reduce((n,f)=>n+(f.bytes||0),0);
 let h=head('Assets and Photography','Show what is missing and who is responsible. Real client photography for live claims. Generated imagery only for a labelled fictional concept.');

 }

  h+=`<div class="note" style="margin-bottom:14px">A successful visual preview is not a completed technical review. Compliance and legal checks start as Not yet checked and need verification from an official source.</div><div class="scroll"><table><thead><tr><th>Quality checks</th><th style="width:170px">Status</th><th>Evidence</th></tr></thead><tbody>${p.review.filter(x=>x.kind==='check').map(row).join('')}</tbody></table></div><div class="scroll" style="margin-top:18px"><table><thead><tr><th>Compliance gates</th><th style="width:170px">Status</th><th>Evidence</th></tr></thead><tbody>${p.review.filter(x=>x.kind==='compliance').map(row).join('')}</tbody></table></div>`;
 }

};

R.export=()=>{

 ST.projects.forEach(x=>{const s=JSON.stringify(Object.assign({},x,{files:[]}));let m;rx.lastIndex=0;while((m=rx.exec(s))&&hits.length<6){hits.push(x.name+': ...'+s.slice(Math.max(0,m.index-25),m.index+35).replace(/[\\"]/g,'')+'...')}});

 <div class="panel stack"><h3>This project</h3>${p?`<p class="small muted">${esc(p.name)}, Rev ${p.rev}</p><div class="row"><button class="btn" data-act="exp" data-a="proj">Project record (.json)</button><button class="btn" data-act="exp" data-a="md">Readable record (.md)</button><button class="btn" data-act="exp" data-a="mdc">Client-safe (.md)</button></div><p class="small muted">The client-safe file leaves out internal notes and items marked internal. It is a plain text file with no protection. Read it before it leaves your hands.</p>`:'<p class="small muted">Open a project to export it.</p>'}</div></div>
 <h2 style="margin:26px 0 10px">Restore or import</h2><div class="panel stack"><div class="row"><label class="btn" for="fileimp">Add projects from a file</label><input id="fileimp" type="file" accept=".json,application/json" style="position:absolute;left:-9999px"><label class="btn" for="filerest">Restore a full backup (replaces everything)</label><input id="filerest" type="file" accept=".json,application/json" style="position:absolute;left:-9999px"><button class="btn" data-act="pasteimp">Paste JSON instead</button></div><p class="small muted">Adding projects never overwrites: a project with the same id is added as a copy.</p></div>

 arr.slice(0,3).forEach((x,i)=>{const d=p.dirs[i],ty=x.typography||x.type||{};
  Object.assign(d,{name:s(x.name),concept:s(x.concept),spacing:s(x.spacing),layout:s(x.layout),photo:s(x.photography||x.photo),aspects:s(x.aspects),interaction:s(x.interaction),motionLib:s(x.motionLib),mobile:s(x.mobile),commercial:s(x.commercial),trade:s(x.tradeoffs||x.trade),status:'Proposed by Rhys',date:today(),source:'Draft from Claude, pasted in',ref:''});

 });

A.libuse=id=>{const x=SEEDS.concat(ST.library).find(y=>y.id===id);const p=P();if(!p||!x)return;modal('Use "'+x.name+'" as a starting point',`<p class="small muted">Copies the palette and fonts into the slot you choose. The concept text stays yours to write. A library entry never decides a client's design.</p><div class="f"><label for="lslot">Which slot?</label><select id="lslot" data-m="slot">${p.dirs.map((d,i)=>`<option value="${i}">Direction ${i+1}${filled(d.concept)||d.palette.length?' (has content: palette and fonts will be replaced)':' (empty)'}</option>`).join('')}</select></div>`,[{label:'Copy into slot',act:'libusego',a:id,cls:'pri'}])};
A.libusego=id=>{const x=SEEDS.concat(ST.library).find(y=>y.id===id);const p=P();const si=+mval('slot')||0;const d=p.dirs[si];
 d.palette=x.pal.map((h,i)=>({hex:h,label:'',role:i===0?'Background':i===1?'Ink':i===2?'Accent':'Other'}));d.type.heading=x.fonts[0]||'';d.type.body=x.fonts[1]||'';d.ref='Starting point from the library: '+x.name+' ('+x.sector+'). '+x.dir;touch();closeModal();UI.dirtab=String(si);render()};
A.libnew=a=>{
 let x={name:'',sector:'',pal:[],fonts:['',''],dir:'',approved:false},id='';
 const p=P();
 if(a.startsWith('edit:')){id=a.slice(5);x=ST.library.find(y=>y.id===id)}
 if(a.startsWith('dir:')&&p){const d=p.dirs[+a.slice(4)];x={name:d.name,sector:(p.disc.b.industry||'').split('\n')[0],pal:d.palette.map(s=>s.hex),fonts:[d.type.heading,d.type.body],dir:d.concept,approved:true}}
 modal(id?'Edit concept':'Add concept to the library',`${a.startsWith('dir:')?'<div class="note warn small">Remove anything that identifies the client before you save. Library entries are reused across projects.</div>':''}<input type="hidden" data-m="id" value="${esc(id)}"><div class="fields"><div class="f"><label>Concept name</label><input data-m="name" value="${esc(x.name)}"></div><div class="f"><label>Sector</label><input data-m="sector" value="${esc(x.sector)}"></div><div class="f wide"><label>Palette (hex codes, comma separated)</label><input data-m="pal" value="${esc(x.pal.join(', '))}"></div><div class="f"><label>Heading font</label><input data-m="f1" value="${esc(x.fonts[0]||'')}"></div><div class="f"><label>Body font</label><input data-m="f2" value="${esc(x.fonts[1]||'')}"></div><div class="f wide"><label>Direction in a sentence or two</label><textarea data-m="dir" rows="3">${esc(x.dir)}</textarea></div><div class="f"><label>Status</label><select data-m="ap"><option value="0"${x.approved?'':' selected'}>Draft</option><option value="1"${x.approved?' selected':''}>Approved reference</option></select></div></div>`,[{label:'Save concept',act:'libsave',cls:'pri'}]);
};
A.libsave=()=>{const n=mval('name').trim();if(!n){toast('Give it a name');return}const pal=mval('pal').split(/[\s,]+/).filter(hexOK);const id=mval('id');const x={id:id||uid(),name:n,sector:mval('sector'),pal,fonts:[mval('f1'),mval('f2')],dir:mval('dir'),approved:mval('ap')==='1'};const k=ST.library.findIndex(y=>y.id===id);if(k>=0)ST.library[k]=x;else ST.library.push(x);touch();closeModal();render()};
A.libdel=id=>{ST.library=ST.library.filter(x=>x.id!==id);touch();render()};
A.pvcta=()=>toast('Concept preview: this button does nothing');

const slug=s=>(s||'project').replace(/[\\/:*?"<>|]/g,'').trim()||'project';
A.exp=async k=>{
 const p=P();const stamp=today();
 const pack=(projects,lib)=>JSON.stringify({app:'website-creative-director',schema:1,exportedAt:new Date().toISOString(),projects,library:lib||[]},null,2);
 if(k==='all'){await offerFile('Website Creative Director backup '+stamp+'.json',pack(ST.projects,ST.library),true);R_refresh();return}
 if(k==='copyall'){copyText(pack(ST.projects,ST.library)).then(ok=>{if(ok){ST.meta.lastBackup=new Date().toISOString();persist();toast('Copied. Paste into a .json file and keep it safe.');render()}else toast('Copy was blocked. Use the download button.')});return}
 if(!p){toast('Open a project first');return}
 if(k==='proj'){await offerFile(slug(p.name)+' project Rev '+p.rev+'.json',pack([p],[]),false)}
 if(k==='md'){await offerFile(slug(p.name)+' record Rev '+p.rev+'.md',mdRecord(p,false),false)}
 if(k==='mdc'){await offerFile(slug(p.name)+' client-safe record Rev '+p.rev+'.md',mdRecord(p,true),false)}
 if(k==='spec'){await offerFile(slug(p.name)+' design specification Rev '+p.rev+'.md',mdSpec(p),false)}
 if(k==='prompt'){await offerFile(slug(p.name)+' Claude Code handoff Rev '+p.rev+'.md',handoffPrompt(p),false)}
 if(k==='copyspec'){copyText(mdSpec(p)).then(ok=>toast(ok?'Specification copied':'Copy was blocked. Use download.'))}
 if(k==='copyprompt'){copyText(handoffPrompt(p)).then(ok=>toast(ok?'Prompt copied':'Copy was blocked. Use download.'))}
};
const R_refresh=()=>{if(UI.sec==='export')render();updateChrome()};
A.pasteimp=()=>modal('Paste exported JSON',`<textarea data-m="json" rows="10" style="font-family:var(--mono);font-size:12px"></textarea>`,[{label:'Add projects',act:'impgo',a:'merge',cls:'pri'},{label:'Replace everything',act:'impgo',a:'replace',cls:'del'}]);
A.impgo=m=>{doImport(mval('json'),m);closeModal()};
A.wipe=()=>modal('Delete all data in this browser?','<p>Every project and custom library entry goes. This cannot be undone. Download a backup first.</p>',[{label:'Delete everything',act:'wipego',cls:'del'}]);
A.wipego=()=>{ST=fresh();persist();closeModal();renderChrome();A.go('projects');render()};
function doImport(text,mode){
 let o;try{o=JSON.parse(text)}catch(e){toast('That is not valid JSON. Check you chose the whole file.');return}
 if(!o||o.app!=='website-creative-director'||!Array.isArray(o.projects)){toast('This is not a Website Creative Director export');return}
 const incoming=o.projects.map(normalize);
 if(mode==='replace'){ST=fresh();ST.projects=incoming;ST.library=Array.isArray(o.library)?o.library:[];ST.activeId=incoming[0]?incoming[0].id:null}
 else{incoming.forEach(x=>{if(ST.projects.some(y=>y.id===x.id)){x.id=uid();x.name+=' (imported)'}ST.projects.push(x)});(o.library||[]).forEach(l=>{if(!ST.library.some(y=>y.id===l.id))ST.library.push(l)});if(!ST.activeId&&ST.projects[0])ST.activeId=ST.projects[0].id}
 touch();persist();renderChrome();render();toast('Imported '+incoming.length+' project'+(incoming.length===1?'':'s'));
}

/* ---------- uploads ---------- */
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{if(file.type==='image/svg+xml'&&r.result.length<250000){res(r.result);return}const img=new Image();img.onload=()=>{const s=Math.min(1,640/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.72))};img.onerror=()=>rej();img.src=r.result};r.onerror=()=>rej();r.readAsDataURL(file)})}
async function handleFiles(list,kind){
 const p=P();if(!p)return;
 for(const f of list){
  try{if(f.type.startsWith('image/')){const u=await shrink(f);p.files.push({id:uid(),name:f.name,kind,note:'',dataUrl:u,bytes:u.length})}else p.files.push({id:uid(),name:f.name,kind,note:'File not stored. Keep the original in your own folder.',dataUrl:'',bytes:0})}
  catch(e){toast('Could not read '+f.name)}
 }
 touch();render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){e.preventDefault();f(el.dataset.a,el)}});
function onField(t,isChange){
 const path=t.dataset.p;const v=t.type==='checkbox'?t.checked:t.value;
 if(t.type==='color'&&!hexOK(v))return;
 setv(path,v);
 document.querySelectorAll('[data-p="'+path+'"]').forEach(x=>{if(x!==t&&x.type!=='checkbox'){if(x.type==='color'&&!hexOK(v))return;x.value=v}});
 const ks=path.split('.'),key=ks[ks.length-1];
 if(key==='status'&&isChange){const o=getv(ks.slice(0,-1).join('.'));if(o&&typeof o==='object'&&'date' in o)o.date=today()}
 if(/\.type\.(heading|body|mono)$/.test(path))ensureFont(v);
 touch();
 if(isChange&&t.dataset.rr)render();
}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.p)onField(t,false)});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='projsel'){A.openproj(t.value);return}
 if(t.id==='upl'){handleFiles(Array.from(t.files),($('#upkind')||{}).value||'Reference');t.value='';return}
 if(t.id==='fileimp'||t.id==='filerest'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(String(r.result),t.id==='filerest'?'replace':'merge');r.readAsText(f);t.value='';return}
 if(t.dataset&&t.dataset.p)onField(t,true);
});
document.addEventListener('submit',e=>{if(e.target.dataset&&e.target.dataset.pvform){e.preventDefault();e.target.reset();toast('Concept preview: nothing was sent or stored')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});

/* ---------- render + route ---------- */
function render(){
 const f=R[UI.sec];
 $('#main').innerHTML=f?f():'';
 const p=P();if(p){p.dirs.forEach(d=>[d.type.heading,d.type.body,d.type.mono].forEach(ensureFont))}
 ST.library.forEach(x=>(x.fonts||[]).forEach(ensureFont));
 updateChrome();
}
function route(){
 const h=location.hash.replace('#','');
 UI.sec=SECTIONS.some(s=>s[0]===h)?h:'projects';
 render();window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
renderChrome();route();
if(!ST.projects.length&&!load())persist();
</script>
