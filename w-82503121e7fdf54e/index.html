:root{--bg:#f4f4f0;--ink:#0b2a5b;--ink2:#33486c;--tint:#e8eaee;--rule:#c4c9d2;--stop:#c0281f;--paper:#fbfbf8}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'IBM Plex Sans',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Newsreader',Georgia,serif;font-weight:500;letter-spacing:-.02em;margin:0;color:var(--ink)}
h1{font-size:38px;line-height:1.1;margin:0 0 8px}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
p{margin:0 0 10px}
.mono,.sm{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}
.sm{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
a{color:var(--ink)}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:8px 12px;z-index:99}
.skip:focus{left:8px;top:8px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;padding:16px 32px 12px;border-bottom:3px double var(--ink);flex-wrap:wrap}
.wm{font-family:'Newsreader',Georgia,serif;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 12px 'IBM Plex Mono',monospace;border:1px solid var(--ink);padding:5px 9px;letter-spacing:.04em}
.btn{font:500 13px 'IBM Plex Sans',sans-serif;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 13px;border-radius:0;cursor:pointer}
.btn:hover{background:var(--tint)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{background:var(--ink2)}

  else if (a === 'printsec') { const id = d.sec; const secs = $$('.copyblock'); secs.forEach(s => { if (s.dataset.sec !== id) s.classList.add('noprint'); }); $$('.sec').forEach(s => { if (!s.contains($('.copyblock[data-sec="' + id + '"]'))) s.classList.add('noprint'); }); window.print(); setTimeout(() => $$('.noprint').forEach(s => { if (s.classList.contains('copyblock') || s.classList.contains('sec')) s.classList.remove('noprint'); }), 500); }

  else if (a === 'seostarter') { const have = S.seo.qs.map(x => (x.q || '').trim()); seoStarterQs().forEach(q => { if (!have.includes(q[1])) S.seo.qs.push({ id: 'P' + (++S.seo.qn), type: q[0], q: q[1] }); }); save(); render(); }

  else if (a === 'seorunrm') { S.seo.runs.splice(Number(d.i), 1); save(); render(); }
  else if (a === 'seoset') { const cp = (S.ui && S.ui.setCp) || 'base', tool = (S.ui && S.ui.setTool) || 'chatgpt'; S.seo.qs.forEach(q => { [1, 2, 3].forEach(n => { if (!S.seo.runs.some(r => r.cp === cp && r.tool === tool && r.pid === q.id && String(r.run) === String(n))) S.seo.runs.push({ cp, date: '', tool, mode: '', pid: q.id, run: String(n), loc: S.seo.loc || '', named: '', pos: '', cited: '', other: '', acc: '', saved: '', model: '' }); }); }); save(); render(); }
  else if (a === 'copyseotest') copyText(seoTestText()).then(() => flash(t));
  else if (a === 'copyseorep') copyText(seoReportText()).then(() => flash(t));
  else if (a === 'copyemail') copyText(emailText()).then(() => flash(t));
  else if (a === 'copyprop') copyText(proposalText()).then(() => flash(t));
  else if (a === 'copytpl') copyText((document.getElementById('pack-template') || {}).textContent || '').then(() => flash(t));
  else if (typeof ACTS2 !== 'undefined' && ACTS2[a]) ACTS2[a](t, d);
});
window.addEventListener('keydown', e => { if (e.key === 'Escape' && S.ui.park) { S.ui.park = false; render(); } });

<script>/* ---------- funding side views ---------- */

  if (web()) { out.push({ id: 'w-sites', label: '3 websites they like and why, and 1 they dislike' }, { id: 'w-assets', label: 'Logo, photos and any words they already have' }, { id: 'w-own', label: 'What they pay for today: domain, hosting, email, and who holds the logins' }); }
  types().forEach(t => { const pt = PROJECT_TYPES.find(x => x.id === t); (pt ? pt.ready : []).forEach((r, i) => out.push({ id: 't-' + t + i, label: r })); });
  return out;
}
function prepText() {
  const items = prepItems(); const note = fund() && P().prepNote ? '\n' + T(P().prepNote) : '';
  return 'Before the call, please have these ready' + (S.client.business ? ' for ' + S.client.business : '') + ':\n' + items.map(i => '- ' + i.label).join('\n') + note;
}
function vSetup() {
  const c = S.client; const p = P();
  const typeBoxes = PROJECT_TYPES.map(t => `<label class="chk"><input type="checkbox" data-want="${t.id}" ${c.types.includes(t.id) ? 'checked' : ''}><span><b>${esc(t.label)}</b><span class="hint">${esc(t.does)}</span></span></label>`).join('');
  const gateQs = gatesAsked().map(g => `<div class="q"><div class="ql">${esc(GATES[g].flagQ)}</div>${seg('client.flags.' + g, [['yes', 'Yes'], ['no', 'No']], c.flags[g])}<div class="hint">${c.flags[g] === 'yes' ? 'The ' + esc(GATES[g].label.toLowerCase()) + ' screen is switched on' : 'Only shown if the answer is yes'}</div></div>`).join('');
  const prep = prepItems().map(i => chk('prep.' + i.id, esc(i.label))).join('');
  const ready = c.business && c.types.length && gatesAsked().every(g => c.flags[g]) && (c.modes.funding || c.modes.website || c.modes.seo);
  const plan = (c.modes.funding || c.modes.website || c.modes.seo) ? callPlan() : []; const planMins = plan.length ? plan[plan.length - 1].end / 60 : 30;
  const planRows = plan.map(b => `<tr><td class="mono">${b.start / 60} to ${b.end / 60} min</td><td>${esc(b.label)}</td><td>${b.screens.map(s => esc(screenLabel(s))).join(', ')}</td></tr>`).join('');
  const packOpts = PACKS.map(x => [x.id, x.name + ', ' + x.funder]);
  return `${head('Tell us about your client', 'A few short questions, they set up the checklist, the cost tips and the wording for everything after', 'setup')}
  ${sec('1.0', 'The client', `<div class="grid2">${field('Business name', 'client.business', { full: true })}${field('Main contact', 'client.contact')}${field('Town', 'client.town')}</div>`)}
  ${sec('2.0', 'What do they want done?', `<p class="hint">Tick all that apply, it changes the cost lines, the checklist and the examples</p>${typeBoxes}`)}
  ${sec('3.0', 'What are we doing?', `${chk('client.modes.funding', '<b>A funding application</b><span class="hint">Eligibility, evidence, project answers, quote, deadlines</span>').replace('data-k=', 'data-full="1" data-k=')}
     ${c.modes.funding ? `<label class="f"><span class="fl">Programme</span>${select('client.packId', packOpts, c.packId).replace('<select ', '<select data-full="1" ')}<span class="hint">One pack per programme, see "How to add a programme"</span></label>` : ''}
     ${chk('client.modes.website', '<b>A website project</b><span class="hint">Discovery, examples, scope, compliance prompts, costs after launch, proposal</span>').replace('data-k=', 'data-full="1" data-k=')}
     ${chk('client.modes.seo', '<b>Local search and AI visibility</b><span class="hint">Optional. Listings, website basics, AI assistants, a fair before and after test. No guaranteed rankings</span>').replace('data-k=', 'data-full="1" data-k=')}
     ${gateQs}
     <div class="q"><div class="ql">Does the client sell age restricted products, like alcohol, vapes or knives?</div>${seg('client.ageRestricted', [['yes', 'Yes'], ['no', 'No']], c.ageRestricted)}<div class="hint">Switches on the age restricted prompt in the compliance list</div></div>`)}
  ${sec('4.0', 'Before the call, the client gets these ready', `<p class="hint">The list follows what they want done</p>${prep || '<p class="hint">Choose what they want done above</p>'}${fund() && P().prepNote ? note(esc(T(P().prepNote))) : ''}<p><button class="btn" data-act="copyprep">Copy this list to send</button></p>`)}
  ${sec('5.0', 'The ' + planMins + ' minute call', `<p>Call mode shows a countdown for the call and for each block. When a block's time is up it ends, and anything unfinished goes to the parking lot. The plan below follows ${fund() ? 'the programme pack' : 'the website plan'}</p>
     <table class="t"><thead><tr><th>Time</th><th>Block</th><th>Screens</th></tr></thead><tbody>${planRows}</tbody></table>
     <p class="row" style="margin-top:14px"><button class="btn pri" data-act="startcall" ${ready ? '' : 'disabled'}>Start the ${planMins} minute call</button><button class="btn" data-act="nocall">Go through it without a timer</button></p>
     ${ready ? '' : '<p class="hint">Add the business name, tick what they want done, and answer the yes or no questions to start the call</p>'}`)}
  ${sec('6.0', 'Privacy, in plain words', `<p>Answers stay on this device. On the online page, when I am signed in, they are also saved to my own private online store, locked to my email. Nothing else is sent anywhere. Bank statements are never uploaded, don't type bank figures in here. Save to file keeps a copy you can open again, on any device.</p><p class="hint">On a shared computer, clear everything at the end</p><p><button class="btn stop" data-act="clear">Clear everything on this device</button></p>
     <details class="gl"><summary>Words you'll hear</summary><table class="t"><tbody>${GLOSSARY.map(g => `<tr><td><b>${esc(g[0])}</b></td><td>${esc(g[1])}</td></tr>`).join('')}</tbody></table></details>`)}`;
}

function factRow(label, f) {
  if (!f || !f.text) return `<div class="q"><div class="ql">${esc(label)}</div><span class="tag ask">Ask the funder</span> <span class="hint">Not stated in the pack, it's on the open questions</span></div>`;
  return `<div class="q"><div class="ql">${esc(label)}</div><div>${esc(T(f.text))}</div>${srcHtml(f.src, f.checked)}</div>`;
}
function vOpen() {
  const p = P(); const dl = dateOf('deadline'), en = dateOf('end');
  const rows = [
    factRow('What it pays', p.award), dl ? factRow(dl.label, { text: fmtDate(dl.value), src: dl.src, checked: dl.checked }) : factRow('Closing date', null),
    en ? factRow(en.label, { text: fmtDate(en.value), src: en.src, checked: en.checked }) : factRow('Finish date', null),
    factRow('How it is paid', p.payment), factRow('Spending before approval', p.preApproval), factRow('If the conditions are broken', p.repay),
    factRow('Who is prioritised', p.priority), factRow('How it is scored', p.scoring), factRow('How to apply', p.howToApply),
    p.turnoverCap ? factRow('Limit tied to turnover', p.turnoverCap) : ''].join('');
  return `${head('The programme in plain words', esc(p.name) + ', run by ' + esc(p.funder), 'open')}
  ${sec('1.0', 'What it is', rows)}
  ${sec('2.0', 'What this app does and doesn\'t do', `<p>It prepares answers to paste into the funder's own form, it doesn't submit anything. It doesn't hold bank statements. It can't predict a score${p.scoring && /weighting/i.test(p.scoring.text || '') ? ', no weightings are published' : ''}.</p>${note('Every fact on this screen comes from the pack, with its source and the date it was checked. Anything the pack leaves empty says "ask the funder"')}`)}
  ${sec('3.0', 'Who does what after the call', `<div class="grid2">${field('The client will', 'owners.client', { area: true, ph: 'e.g. send the registration proof, latest accounts and turnover figure' })}${field(esc(SETTINGS.preparedBy) + ' will', 'owners.us', { area: true, ph: 'e.g. send the quote, email the funder the open questions, draft the project answers' })}</div>`)}`;
}

LIVE.turnover = () => {
  const t = turnoverCheck(); if (!t) return '';
  const rows = t.rows.map(r => `<div><span>${esc(r.n)}: ${r.v ? fmt(r.v) : 'not entered'}</span><span>${r.v ? t.pct + '% is ' + fmt(r.lim) + (t.c.grant > r.lim ? ' <span class="tag bad">Grant asked for is over this</span>' : '') : ''}</span></div>`).join('');
  return `<div class="tot">${rows}<div><span>Grant asked for on the quote screen</span><span>${fmt(t.c.grant)}</span></div></div>`;
};
function vElig() {
  const p = P(); const notes = {}; gatesOn().forEach(g => Object.assign(notes, GATES[g].eligNotes || {}));
  const items = (p.eligibility || []).map(q => {
    const a = S.elig[q.id]; const bad = q.good && a && a !== 'unsure' && a !== q.good;
    const msg = q.good ? (bad ? q.ifBad : '') : (a === 'yes' ? q.ifYes : a === 'no' ? q.ifNo : '');
    return `<div class="q"><div class="ql">${esc(T(q.q))}</div>${seg('elig.' + q.id, [['yes', 'Yes'], ['no', 'No'], ['unsure', 'Not sure']], a)}
      <div class="why"><b>Why it matters:</b> ${esc(T(q.why))}</div>
      ${notes[q.id] ? `<div class="why">${esc(notes[q.id])}</div>` : ''}
      ${msg ? note(esc(T(msg)), bad ? 'stop' : '', bad ? 'What to do:' : 'Note:') : ''}
      ${a === 'unsure' ? note('This goes to the open questions on its own', '', 'Parked:') : ''}${srcHtml(q.src, q.checked)}</div>`;
  }).join('');
  const turn = p.turnoverCap ? sec('2.0', 'Turnover and the limit', `<p>${esc(T(p.turnoverCap.text))}</p>${srcHtml(p.turnoverCap.src, p.turnoverCap.checked)}<div class="grid2" style="margin-top:10px">${field('Recent turnover, £', 'turnover.recent', { ph: 'the figure the client gives' })}${field("Last year's turnover, £", 'turnover.last', { ph: 'the figure the client gives' })}</div><div data-live="turnover"></div>`) : '';
  return `${head('Is the client eligible?', 'Plain yes or no questions, each with the reason the funder asks, a no tells you the next step, it doesn\'t end the conversation', 'elig')}
  ${sec('1.0', 'The questions', items || note('The pack has no eligibility rules, ask the funder', 'stop', 'Missing:'))}${turn}`;
}

function vEvid() {
  const p = P();
  const items = (p.evidence || []).map(e => {
    const k = 'evid.' + e.id;
    return `<div class="q"><div class="ql">${esc(e.label)} ${e.sensitive ? '<span class="tag bad">Sensitive</span>' : ''}</div>
      ${e.hint ? `<div class="hint">${esc(T(e.hint))}</div>` : ''}${e.sensitive ? note(esc(T(e.sensitiveNote || 'Sensitive, do not send it through this app')), 'stop', 'Stop:') : ''}
      <div class="grid3" style="margin-top:6px">${field('Who holds it', k + '.holder')}${field('By what date', k + '.by', { type: 'date' })}<label class="f"><span class="fl">Status</span>${select(k + '.status', [['', 'Not started'], ['asked', 'Asked for'], ['have', 'Have it']], get(k + '.status') || '')}</label></div>${srcHtml(e.src, e.checked)}</div>`;
  }).join('');
  const ready = types().map(t => PROJECT_TYPES.find(x => x.id === t)).filter(Boolean).map(pt => pt.ready.length ? `<div class="q"><div class="ql">${esc(pt.label)}</div>${pt.ready.map((r, i) => chk('prep.t-' + pt.id + i, esc(r))).join('')}</div>` : '').join('');
  return `${head('Evidence', 'The documents the funder asks for, who holds each one and by when, nothing is uploaded or stored here', 'evid')}
  ${sec('1.0', 'What the funder asks for', items || note('The pack lists no evidence, ask the funder', 'stop', 'Missing:'))}

}

function promptBlock(c, x) {

}

function catOptions(sel) {
  const p = P(), mine = new Set(); (p.eligibleCosts || []).forEach(c => { if (!c.types || c.types.some(t => types().includes(t))) mine.add(c.id); });

  const grp = (l, arr) => arr.length ? `<optgroup label="${l}">${arr.join('')}</optgroup>` : '';
  return `<option value="">Choose</option>${grp('For this project', el.filter(c => mine.has(c.id)).map(c => o(c.id, c.label)))}${grp('Other costs the programme pays', el.filter(c => !mine.has(c.id)).map(c => o(c.id, c.label)))}${grp("The programme doesn't pay these", ex.map(c => o(c.id, c.label)))}${o('unsure', 'Not sure, ask the funder')}`;

LIVE.ltag = el => {
  const l = S.quote.lines[Number(el.i)]; if (!l) return ''; const c = costCats()[l.cat];
  if (!l.cat || !c || c.eligible === null) return '<span class="tag ask">Ask the funder</span>';

};
LIVE.totals = () => {
  const c = calc(), p = P(); const vatRule = (p.excludedCosts || []).some(x => x.flag === 'vat');
  const share = c.pct ? c.pct + '% of eligible costs' : 'eligible costs';
  return `<div class="tot">
   <div><span>Eligible costs, ex VAT</span><span>${fmt(c.elig)}</span></div>
   <div><span>Grant you can ask for (${share}${c.max ? ', capped at ' + fmt(c.max) : ', cap not stated, ask the funder'})</span><span class="big">${fmt(c.grant)}</span></div>
   ${c.capped ? `<div><span>Over the cap, the client pays this part</span><span>${fmt(c.elig * (c.pct || 100) / 100 - c.max)}</span></div>` : ''}
   <div><span>Not claimable, listed but not eligible or bought early</span><span>${fmt(c.not)}</span></div>
   <div><span>Not sure yet, treated as not claimable until the funder says</span><span>${fmt(c.unsure)}</span></div>
   <div><span>VAT, a separate line ${vatRule ? '' : '<span class="tag ask">Ask the funder if VAT can be claimed</span>'}</span><span>${fmt(c.vat)}</span></div>
   <div><span><b>The client pays suppliers up front</b></span><span class="big">${fmt(c.paidUp)}</span></div>
   <div><span><b>Claimed back if approved</b></span><span class="big">${fmt(c.grant)}</span></div>
   <div><span><b>The client keeps paying</b></span><span class="big">${fmt(c.keep)}</span></div></div>`;
};
LIVE.ongoing = () => { const o = ownCalc(); return o.yes ? `<p>On the costs after launch page: ${o.blanks ? o.blanks + ' lines have no price yet. ' : ''}first year ${fmt(o.first)}, ${fmt(o.month)} every month, kept apart from this quote.</p>` : '<p class="hint">Nothing on the costs after launch page yet</p>'; };
function vCost() {
  const p = P(); const tips = types().map(t => PROJECT_TYPES.find(x => x.id === t)).filter(x => x && x.tip).map(x => `<li><b>${esc(x.label)}:</b> ${esc(x.tip)}</li>`).join('');
  const lines = S.quote.lines.map((l, i) => `<input data-k="quote.lines.${i}.desc" value="${esc(l.desc)}" placeholder="What is it">

  ${note(esc(T(p.preApproval && p.preApproval.text ? p.preApproval.text : 'Ask the funder whether spending before approval can be claimed')) + '. ' + esc(T(p.payment && p.payment.text ? p.payment.text : 'Ask the funder how it is paid')), 'stop', 'Before anything is bought:')}
  ${note('Do not spend, order or sign anything for the project before the approval letter arrives, the council says anything bought earlier cannot be claimed', 'stop', 'No spend before approval:')}
  ${p.quoteRule ? note(esc(p.quoteRule.text), 'stop', 'Quote honesty rule:') : ''}
  ${sec('1.0', 'Scope in a line', field('What the quote covers', 'quote.scope', { area: true, rows: 2, ph: 'Plain words, one or two sentences' }) + (tips ? `<ul class="hint">${tips}</ul>` : ''))}

     <div class="grid2">${field('VAT on the quote, £, a separate line', 'quote.vat', { ph: 'the amount shown on the quote' })}${field('Quotes held', 'quote.held', { ph: 'who quoted, and how many', hint: p.quotesNeeded && p.quotesNeeded.text ? esc(p.quotesNeeded.text) : 'How many are needed isn\'t stated, it is on the open questions' })}</div>`)}
  ${sec('3.0', 'What it adds up to', '<div data-live="totals"></div>')}
  ${p.turnoverCap ? sec('4.0', 'Check against the turnover limit', `<div data-live="turnover"></div><p class="hint">Turnover is typed on the eligibility screen</p>`) : ''}
  ${sec(p.turnoverCap ? '5.0' : '4.0', 'Ongoing costs, kept apart', `<div data-live="ongoing"></div><p><button class="btn" data-go="own">Open the costs after launch page</button></p>`)}`;
}

/* ---------- deadlines ---------- */
LIVE.deadplan = () => {
  const dl = dateOf('deadline'), en = dateOf('end'); const t = today(); const msgs = [];
  const b = num(S.plan.build), dw = num(S.plan.decision);
  if (en && b) {
    const latestStart = new Date(D(en.value).getTime() - b * 7 * 864e5); msgs.push(`With a ${b} week build, work must start by ${fmtDate(latestStart.toISOString().slice(0, 10))}, and work can't start before the approval letter`);
    if (dw) { const latestSubmit = new Date(latestStart.getTime() - dw * 7 * 864e5); const iso = latestSubmit.toISOString().slice(0, 10);
      msgs.push(`With a ${dw} week decision, the application should go in by ${fmtDate(iso)}${latestSubmit < t ? ', that date has passed, ask the funder before going further' : ''}`); }
    else msgs.push('The funder\'s decision time isn\'t known, it is on the open questions');
  } else if (!en) msgs.push('The finish date isn\'t in the pack, ask the funder'); else msgs.push('Add how many weeks the build takes');
  if (S.plan.start && S.plan.start.slice(5, 7) === '12') msgs.push('A December start only works if the application goes in early and approval is quick, nothing can start until the approval letter');
  if (dl && S.plan.submit && D(S.plan.submit) > D(dl.value)) msgs.push('The planned submit date is after the closing date');
  return msgs.map(m => `<div class="note">${esc(m)}</div>`).join('');
};
function vDead() {
  const dl = dateOf('deadline'), en = dateOf('end'); const t = today();
  let tl = '<p class="hint">Dates aren\'t in the pack, ask the funder</p>';
  if (dl || en) {

    tl = `<div class="tl"><div class="line"></div><div class="m" style="left:0">Today<br>${fmtDate(t.toISOString().slice(0, 10), true)}</div>${dl ? `<div class="m" style="left:${pos(dl.value)}%">${esc(dl.label)}<br>${fmtDate(dl.value, true)}<br>${daysBetween(t, D(dl.value))} days</div>` : ''}${en ? `<div class="m" style="left:${pos(en.value)}%">${esc(en.label)}<br>${fmtDate(en.value, true)}<br>${daysBetween(t, D(en.value))} days</div>` : ''}</div>`;
  }
  return `${head('Deadlines', 'From today to the closing date and the finish date, and the date the application has to go in by', 'dead')}
  ${sec('1.0', 'The timeline', tl + (dl ? srcHtml(dl.src, dl.checked) : ''))}

}

  }).join('');

  ${sec('2.0', 'Every line', lines + '<p><button class="btn" data-add="own.custom" data-fk="label">Add a line</button></p>')}

};
const PROP_SECS = [['goals', 'Your goals, in your words', true], ['problem', 'Where you are now, and what doing nothing costs', true], ['options', 'Your options', false], ['timeline', 'Timeline', false], ['after', 'After launch', false], ['next', 'What happens next', false]];

const INTERNAL_RX = /\b(internal|price book|margins?|my private notes|discovery scor\w*|objections?|call mode|claude code|parking lot|open questions?|ask the funder|never shown to the client|todo)\b/gi;

function scanExport(html) {

<script>/* ---------- revisions for the full job ---------- */
const REV_STATUS = [['draft', 'Draft'], ['sent', 'Sent to the client'], ['accepted', 'Accepted']];
const statusName = s => ({ draft: 'Draft', sent: 'Sent', accepted: 'Accepted', superseded: 'Superseded' }[s] || s);
const CHG_KINDS = [['page', 'New page'], ['feature', 'New feature'], ['design', 'Design change'], ['care', 'Care plan edit'], ['content', 'Content change'], ['price', 'Price or scope change'], ['other', 'Other']];
const kindName = k => (CHG_KINDS.find(x => x[0] === k) || [0, 'Change'])[1];
const FILEK = { quote: 'Quote', req: 'Requirements', contract: 'Contract', cr: 'Change request', handover: 'Acceptance and handover', care: 'Care plan agreement', grantans: 'Grant answers', grantev: 'Grant evidence checklist' };
const docFileBase = m => (String(m.business || seoName()) + ' ' + (FILEK[m.kind] || m.title) + ' Rev ' + m.rev).replace(/[^\w ]/g, '').replace(/\s+/g, ' ').trim();

function revEntry(n) {
  if (!S.rv) S.rv = { revs: [], log: [] };
  let e = S.rv.revs.find(x => x.rev === n);
  if (!e) { e = { rev: n, date: isoToday(), status: n < S.docs.rev ? 'superseded' : 'draft', supersedes: n > 1 ? 'Rev ' + (n - 1) : '', title: n === 1 ? 'First agreed version' : '', sent: '', accepted: '', was: '', frozen: '', snap: null }; S.rv.revs.push(e); S.rv.revs.sort((a, b) => a.rev - b.rev); }
  return e;
}
const curRev = () => revEntry(S.docs.rev);
const revDate = n => revEntry(n).date || isoToday();
const isLocked = () => curRev().status === 'accepted';
function ensureRevs() { for (let r = 1; r <= S.docs.rev; r++) revEntry(r); const c = curRev(); if (c.status === 'sent' && !c.sent) c.sent = isoToday(); if (c.status === 'accepted' && !c.accepted) c.accepted = isoToday(); }
const revMsg = () => 'Rev ' + S.docs.rev + ' is accepted, so it is read only. Use Start Rev ' + (S.docs.rev + 1) + ' to make a change, or set its status back to Sent if you accepted it by mistake';

/* ---- guards, so an accepted Rev is never overwritten ---- */
const OPEN_PATHS = /^(rv\.log\.|ui\.|call\.|drafts\.|docs\.(sig|conf|chk|mynotes|pick|tab)|pb\.)/;
function revBlocked(path) {
  if (!isLocked() && !/^rv\.revs\./.test(path) && !/^rv\.log\./.test(path)) return false;
  let m = path.match(/^rv\.revs\.(\d+)\.(\w+)/);
  if (m) { const e = S.rv.revs[Number(m[1])]; if (!e) return false; if (e.status === 'superseded') return true; return isLocked() && e.rev === S.docs.rev && m[2] !== 'status'; }
  m = path.match(/^rv\.log\.(\d+)\./);
  if (m) { const l = S.rv.log[Number(m[1])]; return !!l && (l.rev !== S.docs.rev || isLocked()); }
  return isLocked() && !OPEN_PATHS.test(path);
}
const GUARD_ACTS = ['qaddpb', 'qrm', 'qpick', 'qnumber', 'qsendfund', 'coladd', 'colrm', 'fontadd', 'fontrm', 'assetrm', 'pairadd', 'pairrm', 'suggpick', 'crclear', 'crload', 'revbase', 'chgadd', 'chgrm'];
function revGuardClick(d) {
  if (!isLocked()) return false;
  const hit = d.pick || d.want || d.rm || (d.add && !/^rv\./.test(d.add)) || GUARD_ACTS.includes(d.act);
  if (hit) { alert(revMsg()); return true; } return false;
}

/* ---- snapshots ---- */
const stripBig = h => String(h).replace(/src="data:[^"]{60000,}"/g, 'src="" data-stripped="1"');
function scopeSnap() {
  const items = scopeItems(), lab = i => i.label || 'New item';
  return { inc: items.filter(i => S.scope.st[i.id] === 'inc').map(lab), not: items.filter(i => S.scope.st[i.id] === 'not').map(lab), extra: items.filter(i => S.scope.st[i.id] === 'extra').map(i => lab(i) + (S.scope.price[i.id] ? ', ' + S.scope.price[i.id] : '')) };
}
function snapModels() {
  const out = {};
  docList().forEach(([k]) => { if (k === 'cr' && S.docs.rev === 1 && !S.cr.on) return; try { const c = JSON.parse(JSON.stringify(docModel(k))); c.body = stripBig(c.body); delete c.secs; out[k] = c; } catch (e) { } });
  return out;

<script>/* ---------- Build handoff: a ready to paste prompt for Claude Code ---------- */
